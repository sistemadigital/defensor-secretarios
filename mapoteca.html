<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapas Judiciales</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        /* =========================================================
           Variables de diseño (réplica de modulos.html)
           ========================================================= */
        @property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
        @property --arc{syntax:'<angle>';initial-value:70deg;inherits:false}

        :root{
            --pad:clamp(12px,2.6vmin,32px);
            --gap:clamp(12px,2.6vmin,32px);
            --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
            --ink:#0b1f3a;
            --mut:#64748b;
            --bd:#e2e8f0;
            --bg:#eef1f6;
            --card:#ffffff;
            --ac:#2563eb;
            --ac2:#4f46e5;
            --grn:#059669;
            --ease:cubic-bezier(.16,1,.3,1);
            --glow:color-mix(in srgb,var(--ac) 32%,transparent);

            /* Alias compat con tokens originales */
            --primary-blue:#2563eb;
            --primary-dark-blue:#1d4ed8;
            --text-secondary:#64748b;
            --border-default:#e2e8f0;

            color-scheme:light;
        }

        @media (prefers-color-scheme:dark){
            :root{
                --ink:#e6eeff;
                --mut:#93a7cb;
                --bd:#1f3560;
                --bg:#071225;
                --card:#0f213f;
                --ac:#60a5fa;
                --ac2:#818cf8;
                --grn:#34d399;
                --glow:color-mix(in srgb,var(--ac) 42%,transparent);

                --primary-blue:#60a5fa;
                --primary-dark-blue:#818cf8;
                --text-secondary:#93a7cb;
                --border-default:#1f3560;

                color-scheme:dark;
            }
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:var(--font);
            background-color:var(--bg);
            color:var(--ink);
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:var(--pad);
            -webkit-font-smoothing:antialiased;
            text-rendering:optimizeLegibility;
        }

        /* =========================================================
           Contenedor principal (tarjeta con arco de luz orbitando)
           ========================================================= */
        .container{
            max-width:1200px;
            width:100%;
            background-color:var(--card);
            border-radius:clamp(20px,3vmin,32px);
            border:1.5px solid transparent;
            padding:clamp(20px,4vmin,40px);
            background:
                linear-gradient(var(--card),var(--card)) padding-box,
                conic-gradient(from var(--ang),transparent 0deg,transparent calc(360deg - var(--arc)),#06b6d4 calc(360deg - var(--arc)*.65),#818cf8 calc(360deg - var(--arc)*.3),#4338ca calc(360deg - 4deg),transparent 360deg) border-box;
            box-shadow:0 1px 2px rgba(15,23,42,.04),0 24px 48px -20px rgba(15,23,42,.18);
            animation:orbit 9s linear infinite, fadeInUp .6s var(--ease) backwards;
            transition:--arc .5s var(--ease);
        }

        .container:hover{
            --arc:150deg;
        }

        /* =========================================================
           Grid de tarjetas (2 columnas fijas, igual que el original)
           ========================================================= */
        .cards-container{
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:var(--gap);
            justify-items:center;
        }

        /* Wrapper de cada módulo */
        .module-wrapper{
            display:flex;
            flex-direction:column;
            align-items:center;
            width:100%;
            max-width:400px;
        }

        /* =========================================================
           Tarjeta de módulo (con arco de luz, firma de modulos)
           ========================================================= */
        .card{
            --accent:var(--ac2);
            --a1:#06b6d4;
            --a2:#818cf8;
            --a3:#4338ca;
            --tint:color-mix(in srgb,var(--accent) 10%,var(--card));
            --lc:color-mix(in srgb,var(--accent) 14%,var(--bd));
            --glowC:color-mix(in srgb,var(--accent) 32%,transparent);
            --fs:clamp(1.05rem,2.8vmin,1.4rem);
            --ic:clamp(60px,10vmin,80px);
            position:relative;
            width:100%;
            min-height:260px;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            text-align:center;
            gap:1rem;
            padding:clamp(24px,4vmin,40px) clamp(20px,3vmin,30px);
            border-radius:clamp(20px,3vmin,28px);
            border:1.5px solid transparent;
            cursor:pointer;
            color:inherit;
            text-decoration:none;
            background:
                linear-gradient(var(--card),var(--card)) padding-box,
                conic-gradient(from var(--ang),transparent 0deg,transparent calc(360deg - var(--arc)),var(--a1) calc(360deg - var(--arc)*.65),var(--a2) calc(360deg - var(--arc)*.3),var(--a3) calc(360deg - 4deg),transparent 360deg) border-box,
                linear-gradient(var(--lc),var(--lc)) border-box;
            box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -16px rgba(15,23,42,.14);
            animation:orbit 9s linear infinite, fadeInUp .6s var(--ease) backwards;
            animation-delay:var(--orbit-delay,0s),var(--fade-delay,0s);
            transition:transform .35s var(--ease),box-shadow .35s var(--ease),--arc .5s var(--ease);
        }

        /* Paleta alternada: verde (par) como en modulos */
        .module-wrapper:nth-child(2) .card{
            --accent:var(--grn);
            --a1:#06b6d4;
            --a2:#10b981;
            --a3:#065f46;
            --tint:color-mix(in srgb,var(--accent) 10%,var(--card));
            --lc:color-mix(in srgb,var(--accent) 14%,var(--bd));
            --glowC:color-mix(in srgb,var(--accent) 32%,transparent);
        }

        /* Stagger */
        .module-wrapper:nth-child(1) .card{--orbit-delay:0s;--fade-delay:0s}
        .module-wrapper:nth-child(2) .card{--orbit-delay:-4.5s;--fade-delay:.1s}

        .card:hover,
        .card:focus-visible{
            --arc:150deg;
            transform:translateY(-4px);
            box-shadow:0 1px 2px rgba(15,23,42,.05),0 26px 46px -20px var(--glowC);
        }

        .card:focus-visible{
            outline:2px solid var(--ac);
            outline-offset:4px;
        }

        /* Icono (con hover rotación + escala, como en modulos) */
        .card-icon{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            width:var(--ic);
            height:var(--ic);
            border-radius:calc(var(--ic)*.3);
            font-size:calc(var(--ic)*.42);
            color:var(--accent);
            background:linear-gradient(135deg,var(--a2),var(--a3)) center/0% 0% no-repeat,var(--tint);
            box-shadow:0 0 0 calc(var(--ic)*.07) color-mix(in srgb,var(--accent) 9%,transparent);
            transition:background-size .4s var(--ease),color .3s,box-shadow .35s,transform .35s var(--ease);
        }

        .card:hover .card-icon,
        .card:focus-visible .card-icon{
            background-size:100% 100%,auto;
            color:#fff;
            transform:rotate(-4deg) scale(1.05);
            box-shadow:0 0 0 calc(var(--ic)*.07 + 3px) color-mix(in srgb,var(--accent) 14%,transparent);
        }

        .card-title{
            font-size:var(--fs);
            font-weight:800;
            letter-spacing:-.03em;
            line-height:1.25;
            color:var(--ink);
            text-wrap:balance;
            overflow-wrap:anywhere;
            transition:color .3s var(--ease);
        }

        .card-title br{
            display:block;
        }

        /* Botón "Abrir mapa" (pill tipo tag de modulos) */
        .card-button{
            margin-top:.25rem;
            padding:.55em 1.4em;
            font-family:inherit;
            font-size:calc(var(--fs)*.7);
            font-weight:700;
            line-height:1.3;
            color:var(--accent);
            background:var(--tint);
            border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
            border-radius:999px;
            cursor:pointer;
            transition:background-color .3s var(--ease),color .3s var(--ease),border-color .3s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease);
        }

        .card:hover .card-button,
        .card:focus-visible .card-button{
            background:var(--accent);
            color:#fff;
            border-color:var(--accent);
            transform:translateY(-1px);
            box-shadow:0 10px 22px -10px var(--glowC);
        }

        .card-button:focus-visible{
            outline:2px solid var(--accent);
            outline-offset:2px;
        }

        /* =========================================================
           Vista del módulo (iframe) – overlay a pantalla completa
           ========================================================= */
        .module-view{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background-color:var(--bg);
            z-index:1000;
            display:none;
            flex-direction:column;
            animation:fadeInUp .4s var(--ease) backwards;
        }

        .module-header{
            background:color-mix(in srgb,var(--card) 82%,transparent);
            backdrop-filter:blur(14px);
            -webkit-backdrop-filter:blur(14px);
            padding:clamp(12px,2vmin,16px) clamp(14px,2.5vmin,20px);
            border-bottom:1px solid var(--bd);
            display:flex;
            justify-content:flex-start;
            box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 20px -12px rgba(15,23,42,.12);
        }

        .back-button{
            display:inline-flex;
            align-items:center;
            gap:.5rem;
            background-color:transparent;
            color:var(--ac);
            border:1.5px solid color-mix(in srgb,var(--ac) 30%,var(--bd));
            padding:.55rem 1.1rem;
            border-radius:12px;
            font-family:inherit;
            font-weight:700;
            font-size:.9rem;
            letter-spacing:-.01em;
            cursor:pointer;
            transition:transform .25s var(--ease),background-color .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease),box-shadow .25s var(--ease);
        }

        .back-button:hover{
            background-color:var(--ac);
            color:#fff;
            border-color:var(--ac);
            transform:translateY(-1px);
            box-shadow:0 10px 22px -10px var(--glow);
        }

        .back-button:focus-visible{
            outline:2px solid var(--ac);
            outline-offset:2px;
        }

        .module-content{
            flex:1;
            width:100%;
            height:calc(100% - 70px);
            background:var(--card);
        }

        iframe{
            width:100%;
            height:100%;
            border:none;
            display:block;
            background:var(--card);
        }

        /* =========================================================
           Animaciones
           ========================================================= */
        @keyframes orbit{to{--ang:360deg}}

        @keyframes fadeInUp{
            from{opacity:0;transform:translateY(20px) scale(.98)}
            to{opacity:1;transform:none}
        }

        @media (prefers-reduced-motion:reduce){
            .container,
            .card,
            .module-view{
                animation:none !important;
            }
            .container{
                background:var(--card);
                border:1.5px solid var(--ac);
            }
            .card{
                background:
                    linear-gradient(var(--card),var(--card)) padding-box,
                    linear-gradient(135deg,var(--a1),var(--a3)) border-box;
            }
            .card:hover .card-icon,
            .card:focus-visible .card-icon{
                transform:none;
            }
        }

        /* =========================================================
           Responsive (mantiene comportamiento original)
           ========================================================= */
        @media (max-width:900px){
            .cards-container{
                grid-template-columns:minmax(0,1fr);
            }
            .module-wrapper{
                max-width:100%;
            }
            .card{
                min-height:unset;
                padding:clamp(20px,3.5vmin,28px) clamp(16px,2.5vmin,22px);
            }
        }

        @media (max-width:768px){
            body{
                padding:calc(var(--pad)*.75);
            }
            .container{
                padding:clamp(16px,3vmin,24px);
            }
            .cards-container{
                gap:var(--gap);
            }
        }

        @media (max-width:480px){
            .card{
                padding:18px;
            }
            .card-icon{
                --ic:56px;
            }
            .back-button{
                padding:.45rem .9rem;
                font-size:.82rem;
            }
        }
    </style>
</head>
<body>

    <!-- Contenedor principal de tarjetas -->
    <div class="container">
        <div class="cards-container" id="cardsContainer">

            <!-- Módulo 1: Circunscripciones (2 líneas) -->
            <div class="module-wrapper">
                <div class="card" data-module="circunscripciones">
                    <div class="card-icon">
                        <i class="fas fa-location-dot"></i>
                    </div>
                    <h3 class="card-title">Mapa de<br>Circunscripciones Judiciales</h3>
                    <button class="card-button">Abrir mapa</button>
                </div>
            </div>

            <!-- Módulo 2: Defensorías en Posadas (3 líneas) -->
            <div class="module-wrapper">
                <div class="card" data-module="defensorias">
                    <div class="card-icon">
                        <i class="fas fa-location-dot"></i>
                    </div>
                    <h3 class="card-title">Mapa de<br>Defensorías<br>en Posadas</h3>
                    <button class="card-button">Abrir mapa</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Vista del módulo seleccionado (iframe) -->
    <div class="module-view" id="moduleView">
        <div class="module-header">
            <button class="back-button" id="backButton">
                <i class="fas fa-arrow-left"></i>
                Volver
            </button>
        </div>
        <div class="module-content">
            <iframe id="moduleFrame" title="Mapa judicial"></iframe>
        </div>
    </div>

    <script>
        // URLs de los módulos (mapas embebidos)
        const modules = {
            circunscripciones: {
                url: "https://sistemadigital.github.io/diligenciadores/misiones-mapa"
            },
            defensorias: {
                url: "https://sistemadigital.github.io/diligenciadores/posadas-mapa"
            }
        };

        // Elementos del DOM
        const container = document.querySelector('.container');
        const moduleView = document.getElementById('moduleView');
        const moduleFrame = document.getElementById('moduleFrame');
        const backButton = document.getElementById('backButton');
        const cardButtons = document.querySelectorAll('.card-button');

        function openModule(moduleKey) {
            const module = modules[moduleKey];
            if (!module) return;
            container.style.display = 'none';
            moduleView.style.display = 'flex';
            moduleFrame.src = module.url;
        }

        function showCards() {
            container.style.display = 'block';
            moduleView.style.display = 'none';
            moduleFrame.src = '';
        }

        // Clic en tarjeta (excepto botón)
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', function(e) {
                if (e.target.classList.contains('card-button')) return;
                const moduleKey = this.getAttribute('data-module');
                openModule(moduleKey);
            });
        });

        // Clic en botón "Abrir mapa"
        cardButtons.forEach(button => {
            button.addEventListener('click', function(e) {
                e.stopPropagation();
                const card = this.closest('.card');
                const moduleKey = card.getAttribute('data-module');
                openModule(moduleKey);
            });
        });

        // Botón volver
        backButton.addEventListener('click', showCards);

        // Tecla Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && moduleView.style.display === 'flex') {
                showCards();
            }
        });
    </script>

</body>
</html>
