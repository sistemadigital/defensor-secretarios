<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Libros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@property --arc{syntax:'<angle>';initial-value:70deg;inherits:false}

:root{
  --pad:clamp(12px,2.6vmin,32px);
  --gap:clamp(12px,2.6vmin,32px);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ink:#0b1f3a;
  --mut:#64748b;
  --bd:#e2e8f0;
  --bg:#eef1f6;
  --card:#fff;
  --ac:#2563eb;
  --ac2:#4f46e5;
  --ease:cubic-bezier(.16,1,.3,1);
  --c-ind:#4f46e5;
  --c-grn:#065f46;
  --c-amb:#b45309;
  --c-ros:#be185d;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#e6eeff;
    --mut:#93a7cb;
    --bd:#1f3560;
    --bg:#071225;
    --card:#0f213f;
    --ac:#60a5fa;
    --ac2:#818cf8;
    --c-ind:#818cf8;
    --c-grn:#34d399;
    --c-amb:#fbbf24;
    --c-ros:#f472b6;
    color-scheme:dark;
  }
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:max(var(--pad),env(safe-area-inset-top)) max(var(--pad),env(safe-area-inset-right)) max(var(--pad),env(safe-area-inset-bottom)) max(var(--pad),env(safe-area-inset-left));
  background:var(--bg);
  color:var(--ink);
  font:15px/1.5 var(--font);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* =========================================================
   Contenedor principal (borde animado de módulos)
   ========================================================= */
.container{
  max-width:1200px;
  width:100%;
  border-radius:clamp(20px,3vmin,32px);
  border:1.5px solid transparent;
  padding:clamp(20px,4vmin,40px);
  background:
    linear-gradient(var(--card),var(--card)) padding-box,
    conic-gradient(from var(--ang),transparent 0deg,transparent calc(360deg - var(--arc)),#06b6d4 calc(360deg - var(--arc)*.65),#818cf8 calc(360deg - var(--arc)*.3),#4338ca calc(360deg - 4deg),transparent 360deg) border-box;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 24px 48px -20px rgba(15,23,42,.18);
  animation:orbit 9s linear infinite,fadeInUp .6s var(--ease) backwards;
  transition:--arc .5s var(--ease),box-shadow .4s var(--ease);
}

.container:hover{
  --arc:150deg;
  box-shadow:0 1px 2px rgba(15,23,42,.05),0 26px 46px -20px color-mix(in srgb,var(--ac) 32%,transparent);
}

.cards-container{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(2,auto);
  gap:var(--gap);
  justify-items:center;
  width:100%;
}

/* Tarjeta (módulo) */
.card{
  --accent:var(--c-ind);
  --a1:#06b6d4;
  --a2:#818cf8;
  --a3:#4338ca;
  --tint:color-mix(in srgb,var(--accent) 10%,var(--card));
  --lc:color-mix(in srgb,var(--accent) 14%,var(--bd));
  --glow:color-mix(in srgb,var(--accent) 32%,transparent);
  --fs:clamp(1.1rem,3.6vmin,2.6rem);
  --ic:calc(var(--fs)*2.2);
  --ring:calc(var(--ic)*.07);
  --ang:0deg;
  --arc:70deg;
  width:100%;
  max-width:400px;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:calc(var(--fs)*.5);
  padding:clamp(1rem,4vmin,3rem);
  border-radius:clamp(24px,5vmin,48px);
  border:1.5px solid transparent;
  color:inherit;
  text-decoration:none;
  cursor:pointer;
  background:
    linear-gradient(var(--card),var(--card)) padding-box,
    conic-gradient(from var(--ang),transparent 0deg,transparent calc(360deg - var(--arc)),var(--a1) calc(360deg - var(--arc)*.65),var(--a2) calc(360deg - var(--arc)*.3),var(--a3) calc(360deg - 4deg),transparent 360deg) border-box,
    linear-gradient(var(--lc),var(--lc)) border-box;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -16px rgba(15,23,42,.14);
  animation:orbit 9s linear infinite,fadeInUp .6s var(--ease) backwards;
  transition:transform .35s var(--ease),box-shadow .35s,--arc .5s;
}
.card:nth-child(1){--accent:var(--c-ind);--a1:#06b6d4;--a2:#818cf8;--a3:#4338ca;animation-delay:0s,.05s}
.card:nth-child(2){--accent:var(--c-grn);--a1:#06b6d4;--a2:#10b981;--a3:#065f46;animation-delay:-2.25s,.12s}
.card:nth-child(3){--accent:var(--c-amb);--a1:#fbbf24;--a2:#f59e0b;--a3:#b45309;animation-delay:-4.5s,.19s}
.card:nth-child(4){--accent:var(--c-ros);--a1:#f472b6;--a2:#ec4899;--a3:#9d174d;animation-delay:-6.75s,.26s}

@keyframes orbit{to{--ang:360deg}}
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(30px) scale(.95)}
  to{opacity:1;transform:none}
}

.card:hover,.card:focus-visible{
  --arc:150deg;
  transform:translateY(-4px);
  box-shadow:0 1px 2px rgba(15,23,42,.05),0 26px 46px -20px var(--glow);
}
.card:focus-visible{outline:2px solid var(--ac);outline-offset:4px}

.card i.ic{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:var(--ic);
  height:var(--ic);
  margin-bottom:calc(var(--fs)*.2);
  border-radius:calc(var(--ic)*.3);
  font-size:calc(var(--ic)*.5);
  color:var(--accent);
  background:linear-gradient(135deg,var(--a2),var(--a3)) center/0% 0% no-repeat,var(--tint);
  box-shadow:0 0 0 var(--ring) color-mix(in srgb,var(--accent) 9%,transparent);
  transition:background-size .4s var(--ease),color .3s,box-shadow .35s,transform .35s var(--ease);
}
.card:hover i.ic,.card:focus-visible i.ic{
  background-size:100% 100%,auto;
  color:#fff;
  transform:rotate(-4deg) scale(1.05);
  box-shadow:0 0 0 calc(var(--ring) + 3px) color-mix(in srgb,var(--accent) 14%,transparent);
}

.card h2{
  margin:0;
  max-width:100%;
  font-size:var(--fs);
  font-weight:800;
  letter-spacing:-.03em;
  line-height:1.15;
  text-wrap:balance;
  overflow-wrap:anywhere;
}

.card-button{
  margin-top:calc(var(--fs)*.15);
  padding:.25em 1.1em;
  font-family:inherit;
  font-size:calc(var(--fs)*.5);
  font-weight:700;
  line-height:1.4;
  color:var(--accent);
  background:var(--tint);
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  border-radius:999px;
  cursor:pointer;
  transition:background-color .25s,color .25s,transform .25s var(--ease);
}
.card-button:hover{
  background:var(--accent);
  color:#fff;
  transform:scale(1.04);
}

/* Vista del libro */
.book-view{
  position:fixed;
  inset:0;
  background:var(--bg);
  z-index:1000;
  display:none;
  flex-direction:column;
}
.book-header{
  padding:max(calc(var(--pad)*.6),12px) max(var(--pad),12px);
  display:flex;
  justify-content:flex-start;
}
.back-button{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:12px 20px;
  font-family:inherit;
  font-size:.95rem;
  font-weight:600;
  color:var(--ink);
  background:var(--card);
  border:1.5px solid var(--bd);
  border-radius:14px;
  cursor:pointer;
  box-shadow:0 1px 2px rgba(15,23,42,.04);
  transition:transform .3s var(--ease),border-color .3s,color .3s,box-shadow .3s;
}
.back-button:hover{
  transform:translateX(-3px);
  border-color:var(--ac);
  color:var(--ac);
  box-shadow:0 8px 20px -10px color-mix(in srgb,var(--ac) 40%,transparent);
}
.book-content{
  flex:1;
  min-height:0;
  width:100%;
}
iframe{
  width:100%;
  height:100%;
  border:none;
  display:block;
}

/* Responsive */
@media(max-width:700px),(max-aspect-ratio:1/1){
  .cards-container{
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:repeat(4,auto);
  }
  .card{--fs:clamp(0.9rem,min(2.8dvh,5vw),1.9rem);max-width:100%}
}

@media(prefers-reduced-motion:reduce){
  .container{
    animation:none;
    background:var(--card);
    border:1.5px solid var(--ac);
  }
  .container:hover{--arc:70deg}
  .card{
    animation:none;
    background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--a1),var(--a3)) border-box;
    transition:box-shadow .2s;
  }
  .card:hover,.card:focus-visible{transform:none}
  .card i.ic,.card:hover i.ic,.card:focus-visible i.ic{transition:none;transform:none}
}
</style>
</head>
<body>

  <div class="container">
    <div class="cards-container" id="cardsContainer">

      <div class="card" data-book="escritos">
        <i class="ic bi bi-journal-richtext" aria-hidden="true"></i>
        <h2>Libro de Escritos</h2>
        <button class="card-button" type="button">Abrir</button>
      </div>

      <div class="card" data-book="dictamen">
        <i class="ic bi bi-file-earmark-check" aria-hidden="true"></i>
        <h2>Libro de Dictamen</h2>
        <button class="card-button" type="button">Abrir</button>
      </div>

      <div class="card" data-book="oficios">
        <i class="ic bi bi-envelope-paper" aria-hidden="true"></i>
        <h2>Libro de Oficios</h2>
        <button class="card-button" type="button">Abrir</button>
      </div>

      <div class="card" data-book="actas">
        <i class="ic bi bi-journal-bookmark" aria-hidden="true"></i>
        <h2>Libro de Actas</h2>
        <button class="card-button" type="button">Abrir</button>
      </div>

    </div>
  </div>

  <!-- Vista del libro seleccionado -->
  <div class="book-view" id="bookView">
    <div class="book-header">
      <button class="back-button" id="backButton" type="button">
        <i class="bi bi-arrow-left"></i>
        Volver
      </button>
    </div>
    <div class="book-content">
      <iframe id="bookFrame" title="Libro"></iframe>
    </div>
  </div>

  <script>
    // URLs de los libros
    const books = {
      escritos: {
        url: "https://sistemadigital.github.io/defensor-secretarios/escritos"
      },
      dictamen: {
        url: "https://admindefensoria6.github.io/registro-dictamen/"
      },
      oficios: {
        url: "https://admindefensoria6.github.io/registro-oficios/"
      },
      actas: {
        url: "https://admindefensoria6.github.io/registro-actas/"
      }
    };

    // Elementos del DOM
    const cardsContainer = document.getElementById('cardsContainer');
    const bookView = document.getElementById('bookView');
    const bookFrame = document.getElementById('bookFrame');
    const backButton = document.getElementById('backButton');
    const cardButtons = document.querySelectorAll('.card-button');
    const container = document.querySelector('.container');

    // Abrir un libro
    function openBook(bookKey) {
      const book = books[bookKey];

      cardsContainer.style.display = 'none';
      container.style.display = 'none';
      bookView.style.display = 'flex';

      bookFrame.src = book.url;
    }

    // Volver a las tarjetas
    function showCards() {
      cardsContainer.style.display = 'grid';
      container.style.display = 'block';
      bookView.style.display = 'none';

      bookFrame.src = '';
    }

    // Event listeners para las tarjetas
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', function() {
        const bookKey = this.getAttribute('data-book');
        openBook(bookKey);
      });
    });

    // Event listeners para los botones dentro de las tarjetas
    cardButtons.forEach(button => {
      button.addEventListener('click', function(e) {
        e.stopPropagation();
        const card = this.closest('.card');
        const bookKey = card.getAttribute('data-book');
        openBook(bookKey);
      });
    });

    // Event listener para el botón de volver
    backButton.addEventListener('click', showCards);

    // Permitir volver con la tecla Escape
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && bookView.style.display === 'flex') {
        showCards();
      }
    });
  </script>
</body>
</html>
