<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Eventos</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <!-- Font Awesome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

    <style>
        /* =========================================================
           Variables de diseño (réplica de modulos.html)
           ========================================================= */
        @property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
        @property --arc{syntax:'<angle>';initial-value:70deg;inherits:false}

        :root{
            --pad:clamp(12px,2.6vmin,32px);
            --gap:clamp(12px,2.6vmin,32px);
            --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
            --ink:#0b1f3a;
            --mut:#64748b;
            --bd:#e2e8f0;
            --bg:#eef1f6;
            --card:#ffffff;
            --ac:#2563eb;
            --ac2:#4f46e5;
            --ease:cubic-bezier(.16,1,.3,1);
            --past:#94a3b8;
            --future:#0369a1;
            --glow:color-mix(in srgb,var(--ac) 32%,transparent);
            color-scheme:light;
        }

        @media (prefers-color-scheme:dark){
            :root{
                --ink:#e6eeff;
                --mut:#93a7cb;
                --bd:#1f3560;
                --bg:#071225;
                --card:#0f213f;
                --ac:#60a5fa;
                --ac2:#818cf8;
                --past:#64748b;
                --future:#7dd3fc;
                --glow:color-mix(in srgb,var(--ac) 42%,transparent);
                color-scheme:dark;
            }
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:var(--font);
            background-color:var(--bg);
            color:var(--ink);
            height:100vh;
            display:flex;
            flex-direction:column;
            overflow:hidden;
            padding:var(--pad);
            gap:var(--gap);
            -webkit-font-smoothing:antialiased;
            text-rendering:optimizeLegibility;
        }

        /* =========================================================
           HEADER CALENDARIO  (tarjeta estilo modulos)
           ========================================================= */
        header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:1rem;
            padding:clamp(.6rem,1.8vmin,1rem) clamp(1rem,2.5vmin,1.5rem);
            background-color:var(--card);
            border:1.5px solid var(--bd);
            border-radius:clamp(16px,2.5vmin,24px);
            box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 20px -12px rgba(15,23,42,.12);
            animation:fadeInUp .6s var(--ease) backwards;
            z-index:10;
        }

        .controls{
            display:flex;
            gap:.6rem;
            align-items:center;
        }

        .controls button{
            background-color:var(--card);
            border:1.5px solid color-mix(in srgb,var(--ac) 30%,var(--bd));
            color:var(--ac);
            padding:.55rem 1.05rem;
            border-radius:12px;
            font-family:inherit;
            font-weight:700;
            font-size:.9rem;
            cursor:pointer;
            display:flex;
            align-items:center;
            gap:.5rem;
            transition:background-color .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease);
            box-shadow:0 1px 2px rgba(15,23,42,.04);
        }

        .controls button:hover{
            background-color:var(--ac);
            color:#fff;
            border-color:var(--ac);
            transform:translateY(-1px);
            box-shadow:0 10px 22px -10px var(--glow);
        }

        .controls button:focus-visible{
            outline:2px solid var(--ac);
            outline-offset:2px;
        }

        .month-display{
            font-size:clamp(1.35rem,3.4vmin,1.8rem);
            font-weight:800;
            letter-spacing:-.03em;
            color:var(--ac);
            text-transform:capitalize;
            text-wrap:balance;
        }

        /* =========================================================
           CUADRICULA DEL CALENDARIO (tarjeta estilo modulos)
           ========================================================= */
        .calendar-container{
            flex:1;
            min-height:0;
            display:flex;
            flex-direction:column;
            background-color:var(--card);
            padding:clamp(.75rem,2vmin,1.25rem);
            border:1.5px solid var(--bd);
            border-radius:clamp(20px,3vmin,32px);
            box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -16px rgba(15,23,42,.14);
            animation:fadeInUp .6s var(--ease) .08s backwards;
        }

        .weekdays{
            display:grid;
            grid-template-columns:repeat(7,1fr);
            text-align:center;
            font-weight:700;
            font-size:.85rem;
            letter-spacing:-.01em;
            color:var(--ac);
            padding-bottom:.6rem;
            border-bottom:2px solid color-mix(in srgb,var(--ac) 30%,var(--bd));
            margin-bottom:.6rem;
        }

        .days-grid{
            display:grid;
            grid-template-columns:repeat(7,1fr);
            grid-auto-rows:1fr;
            flex:1;
            gap:6px;
            min-height:0;
        }

        .day-cell{
            border:1px solid var(--bd);
            border-radius:14px;
            padding:.55rem;
            display:flex;
            flex-direction:column;
            cursor:pointer;
            background-color:var(--card);
            position:relative;
            min-height:0;
            transition:transform .3s var(--ease),box-shadow .3s var(--ease),background-color .25s var(--ease),border-color .25s var(--ease);
        }

        .day-cell:hover:not(.empty){
            background-color:color-mix(in srgb,var(--ac) 6%,var(--card));
            border-color:color-mix(in srgb,var(--ac) 40%,var(--bd));
            transform:translateY(-3px);
            box-shadow:0 14px 26px -14px var(--glow);
        }

        .day-cell.empty{
            background-color:transparent;
            border:none;
            cursor:default;
        }

        .day-number{
            font-size:1.15rem;
            font-weight:700;
            text-align:right;
            margin-bottom:.35rem;
            letter-spacing:-.02em;
        }

        /* Estados de fecha */
        .day-cell.past .day-number{
            color:var(--past);
            font-weight:700;
        }

        .day-cell.future .day-number{
            color:var(--future);
            font-weight:700;
        }

        /* HOY: borde con arco de luz orbitando (firma de modulos) */
        .day-cell.today{
            border:1.5px solid transparent;
            background:
                linear-gradient(var(--card),var(--card)) padding-box,
                conic-gradient(from var(--ang),transparent 0deg,transparent calc(360deg - var(--arc)),#06b6d4 calc(360deg - var(--arc)*.65),#818cf8 calc(360deg - var(--arc)*.3),#4338ca calc(360deg - 4deg),transparent 360deg) border-box;
            animation:orbit 9s linear infinite;
            transition:transform .3s var(--ease),box-shadow .3s var(--ease),--arc .5s var(--ease);
        }

        .day-cell.today:hover{
            --arc:150deg;
            transform:translateY(-3px);
            box-shadow:0 14px 26px -14px var(--glow);
        }

        .day-cell.today .day-number{
            color:var(--ac);
            font-weight:800;
            font-size:1.4rem;
        }

        /* Indicador de eventos: píldora tipo "tag" de modulos */
        .event-indicator{
            background:color-mix(in srgb,var(--ac) 12%,transparent);
            color:var(--ac);
            font-size:.7rem;
            font-weight:700;
            padding:2px 8px;
            border-radius:999px;
            border:1px solid color-mix(in srgb,var(--ac) 28%,transparent);
            margin-top:auto;
            align-self:center;
            text-align:center;
            white-space:nowrap;
            transition:background-color .2s var(--ease),color .2s var(--ease);
        }

        /* =========================================================
           MODAL (tarjeta con arco de luz)
           ========================================================= */
        .modal-overlay{
            position:fixed;
            inset:0;
            background-color:rgba(7,18,37,.55);
            backdrop-filter:blur(4px);
            -webkit-backdrop-filter:blur(4px);
            display:flex;
            justify-content:center;
            align-items:center;
            z-index:1000;
            opacity:0;
            pointer-events:none;
            transition:opacity .3s var(--ease);
        }

        .modal-overlay.active{
            opacity:1;
            pointer-events:auto;
        }

        .modal-content{
            width:90%;
            max-width:600px;
            max-height:80vh;
            display:flex;
            flex-direction:column;
            border-radius:clamp(20px,3vmin,32px);
            border:1.5px solid transparent;
            background:
                linear-gradient(var(--card),var(--card)) padding-box,
                conic-gradient(from var(--ang),transparent 0deg,transparent calc(360deg - var(--arc)),#06b6d4 calc(360deg - var(--arc)*.65),#818cf8 calc(360deg - var(--arc)*.3),#4338ca calc(360deg - 4deg),transparent 360deg) border-box;
            box-shadow:0 24px 48px -16px rgba(15,23,42,.3),0 0 0 1px color-mix(in srgb,var(--ac) 8%,transparent);
            transform:scale(.96);
            transition:transform .35s var(--ease);
            animation:orbit 9s linear infinite;
            animation-play-state:paused;
        }

        .modal-overlay.active .modal-content{
            transform:scale(1);
            animation-play-state:running;
        }

        .modal-header{
            padding:1.25rem 1.5rem;
            border-bottom:1px solid var(--bd);
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:1rem;
        }

        .modal-title{
            color:var(--ac);
            font-size:1.25rem;
            font-weight:800;
            letter-spacing:-.02em;
            line-height:1.25;
        }

        .close-btn{
            background:none;
            border:none;
            width:36px;
            height:36px;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            border-radius:10px;
            font-size:1.15rem;
            color:var(--mut);
            cursor:pointer;
            transition:background-color .2s var(--ease),color .2s var(--ease),transform .2s var(--ease);
        }

        .close-btn:hover{
            background:color-mix(in srgb,var(--ac) 10%,transparent);
            color:var(--ac);
            transform:rotate(90deg);
        }

        .modal-body{
            padding:1.25rem 1.5rem;
            overflow-y:auto;
            flex:1;
        }

        /* Items de evento dentro del modal */
        .event-item{
            background:color-mix(in srgb,var(--ac) 5%,var(--card));
            border-left:4px solid var(--ac);
            padding:1rem 1rem 1rem 1.1rem;
            margin-bottom:.9rem;
            border-radius:0 14px 14px 0;
            transition:transform .25s var(--ease),box-shadow .25s var(--ease),background-color .25s var(--ease);
        }

        .event-item:last-child{
            margin-bottom:0;
        }

        .event-item:hover{
            transform:translateX(3px);
            background:color-mix(in srgb,var(--ac) 9%,var(--card));
            box-shadow:-6px 0 20px -10px var(--glow);
        }

        .event-type{
            display:inline-block;
            font-size:.7rem;
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:.04em;
            color:var(--ac);
            background:color-mix(in srgb,var(--ac) 12%,transparent);
            border:1px solid color-mix(in srgb,var(--ac) 28%,transparent);
            padding:2px 9px;
            border-radius:999px;
            margin-bottom:.5rem;
        }

        .event-expediente{
            font-weight:800;
            font-size:1.05rem;
            letter-spacing:-.01em;
            margin-bottom:.3rem;
        }

        .event-details{
            font-size:.875rem;
            color:var(--mut);
            line-height:1.5;
        }

        .no-events{
            text-align:center;
            color:var(--mut);
            font-style:italic;
            padding:2rem 0;
        }

        /* =========================================================
           Pantalla de carga
           ========================================================= */
        .loading-screen{
            position:fixed;
            inset:0;
            background-color:color-mix(in srgb,var(--bg) 92%,transparent);
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            z-index:2000;
            color:var(--ac);
            font-weight:700;
            font-size:1.1rem;
            gap:.75rem;
        }

        /* =========================================================
           Animaciones (réplica de modulos)
           ========================================================= */
        @keyframes orbit{
            to{--ang:360deg}
        }

        @keyframes fadeInUp{
            from{
                opacity:0;
                transform:translateY(20px) scale(.98);
            }
            to{
                opacity:1;
                transform:none;
            }
        }

        @media (prefers-reduced-motion:reduce){
            header,
            .calendar-container,
            .day-cell.today,
            .modal-content{
                animation:none !important;
            }
            .day-cell.today{
                border:1.5px solid var(--ac);
                background:var(--card);
            }
            .modal-content{
                border:1.5px solid var(--ac);
                background:var(--card);
            }
        }
    </style>
</head>
<body>

    <!-- Pantalla de carga inicial -->
    <div id="loadingScreen" class="loading-screen">
        <i class="fas fa-circle-notch fa-spin fa-3x"></i>
        <p>Cargando eventos desde la base de datos...</p>
    </div>

    <!-- Encabezado superior -->
    <header>
        <div class="controls">
            <button id="btnPrev" title="Mes Anterior"><i class="fas fa-chevron-left"></i> Pasado</button>
            <button id="btnToday" title="Ir a hoy"><i class="fas fa-calendar-day"></i> Hoy</button>
            <button id="btnNext" title="Mes Siguiente">Futuro <i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="month-display" id="monthDisplay">Mes Año</div>
    </header>

    <!-- Área del Calendario -->
    <div class="calendar-container">
        <div class="weekdays">
            <div>Domingo</div>
            <div>Lunes</div>
            <div>Martes</div>
            <div>Miércoles</div>
            <div>Jueves</div>
            <div>Viernes</div>
            <div>Sábado</div>
        </div>
        <div class="days-grid" id="calendarGrid">
            <!-- Los días se inyectan mediante JS -->
        </div>
    </div>

    <!-- Modal de Eventos del Día -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalDateTitle">Eventos del Día</h3>
                <button class="close-btn" id="closeModalBtn" aria-label="Cerrar"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Los eventos del día se inyectan aquí -->
            </div>
        </div>
    </div>

    <script>
        // ====================================================
        // 1. Configuración de Bases de Datos Firebase (Original)
        // ====================================================
        const firebaseConfigHistorica = {
            apiKey: "AIzaSyBt6X0u0BpiNPcV2SNPrN-spCmjl2AhZaA",
            authDomain: "causas-defensoria.firebaseapp.com",
            projectId: "causas-defensoria",
            storageBucket: "causas-defensoria.appspot.com",
            messagingSenderId: "186064671470",
            appId: "1:186064671470:web:b58bae5eadbe6e469f19ff"
        };
        const firebaseConfigNueva = {
            apiKey: "AIzaSyBevCwkh4iOWVqhp3gG2ae1eCUMkFpnr6I",
            authDomain: "causas-2defensoria.firebaseapp.com",
            projectId: "causas-2defensoria",
            storageBucket: "causas-2defensoria.firebasestorage.app",
            messagingSenderId: "663905632804",
            appId: "1:663905632804:web:4f686a88004dc642ad0eb1"
        };

        let dbHistorica, dbNueva;
        try {
            let appHistorica, appNueva;
            if (firebase.apps.length === 0) {
                appHistorica = firebase.initializeApp(firebaseConfigHistorica, "historica");
                appNueva = firebase.initializeApp(firebaseConfigNueva, "nueva");
            } else {
                appHistorica = firebase.app("historica") || firebase.initializeApp(firebaseConfigHistorica, "historica");
                appNueva = firebase.app("nueva") || firebase.initializeApp(firebaseConfigNueva, "nueva");
            }
            dbHistorica = appHistorica.firestore();
            dbNueva = appNueva.firestore();
        } catch (e) {
            console.error("Error inicializando Firebase:", e);
        }

        // ====================================================
        // 2. Variables Globales para Calendario y Eventos
        // ====================================================
        let eventosPlanos = [];
        let currentDate = new Date(); // Fecha actual real
        let navDate = new Date();     // Fecha que controla el mes visible

        const monthDisplay = document.getElementById('monthDisplay');
        const calendarGrid = document.getElementById('calendarGrid');
        const loadingScreen = document.getElementById('loadingScreen');
        const eventModal = document.getElementById('eventModal');
        const modalBody = document.getElementById('modalBody');
        const modalDateTitle = document.getElementById('modalDateTitle');

        // ====================================================
        // 3. Funciones de Extracción y Formateo
        // ====================================================
        function toDate(val) {
            if (!val) return null;
            if (val.toDate) return val.toDate();
            if (val.seconds) return new Date(val.seconds * 1000);
            if (val instanceof Date) return val;
            return new Date(val);
        }

        function formatearHora(fecha) {
            const d = toDate(fecha);
            if (!d || isNaN(d)) return "";
            return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        // ====================================================
        // 4. Lógica de Carga de Eventos
        // ====================================================
        async function cargarEventos() {
            try {
                const [snapshotHistorica, snapshotNueva] = await Promise.all([
                    dbHistorica.collection("causas").get(),
                    dbNueva.collection("causas").get()
                ]);

                const eventos = [];
                const procesarCausa = (causa) => {
                    const juzgado = causa.juzgado || '';

                    const agregar = (fechaRaw, tipoId, tipoLabel) => {
                        const fechaObj = toDate(fechaRaw);
                        if (fechaObj) {
                            eventos.push({
                                tipo: tipoId,
                                tipoLabel: tipoLabel,
                                fecha: fechaObj,
                                numCausa: causa.numCausa || 'S/N',
                                caratula: causa.caratula || '',
                                juzgado: juzgado
                            });
                        }
                    };

                    if (Array.isArray(causa.audiencias)) causa.audiencias.forEach(f => agregar(f, 'audiencia', 'Audiencia'));
                    if (causa.audienciaGesell) agregar(causa.audienciaGesell, 'gesell', 'C. Gesell');
                    if (causa.vencimiento) agregar(causa.vencimiento, 'vencimiento', 'Vencimiento');
                    if (causa.vencimientoRecursos) agregar(causa.vencimientoRecursos, 'recurso', 'Recurso');
                    if (Array.isArray(causa.diligencias)) causa.diligencias.forEach(d => agregar(d.fecha, 'diligencia', 'Diligencia'));
                };

                snapshotHistorica.forEach(doc => procesarCausa({ id: doc.id, ...doc.data() }));
                snapshotNueva.forEach(doc => procesarCausa({ id: doc.id, ...doc.data() }));

                return eventos;
            } catch (error) {
                console.error("Error cargando eventos:", error);
                return [];
            }
        }

        // ====================================================
        // 5. Motor del Calendario Mensual
        // ====================================================
        function renderizarCalendario() {
            calendarGrid.innerHTML = '';

            const year = navDate.getFullYear();
            const month = navDate.getMonth();

            const options = { month: 'long', year: 'numeric' };
            monthDisplay.textContent = navDate.toLocaleDateString('es-ES', options);

            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const todayReset = new Date();
            todayReset.setHours(0, 0, 0, 0);

            for (let i = 0; i < firstDayOfMonth; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell empty';
                calendarGrid.appendChild(emptyCell);
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const cellDate = new Date(year, month, i);
                cellDate.setHours(0, 0, 0, 0);

                const cell = document.createElement('div');
                cell.className = 'day-cell';

                if (cellDate.getTime() === todayReset.getTime()) {
                    cell.classList.add('today');
                } else if (cellDate < todayReset) {
                    cell.classList.add('past');
                } else {
                    cell.classList.add('future');
                }

                const numberDiv = document.createElement('div');
                numberDiv.className = 'day-number';
                numberDiv.textContent = i;
                cell.appendChild(numberDiv);

                const eventosDelDia = eventosPlanos.filter(ev => {
                    const evDate = new Date(ev.fecha);
                    evDate.setHours(0, 0, 0, 0);
                    return evDate.getTime() === cellDate.getTime();
                });

                if (eventosDelDia.length > 0) {
                    const indicator = document.createElement('div');
                    indicator.className = 'event-indicator';
                    indicator.textContent = `${eventosDelDia.length} evento${eventosDelDia.length > 1 ? 's' : ''}`;
                    cell.appendChild(indicator);
                }

                cell.addEventListener('click', () => abrirModal(cellDate, eventosDelDia));
                calendarGrid.appendChild(cell);
            }
        }

        // ====================================================
        // 6. Lógica del Modal
        // ====================================================
        function abrirModal(fechaObj, eventosDelDia) {
            modalDateTitle.textContent = fechaObj.toLocaleDateString('es-ES', {
                weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
            }).toUpperCase();

            modalBody.innerHTML = '';

            if (eventosDelDia.length === 0) {
                modalBody.innerHTML = '<div class="no-events">No hay eventos registrados para esta fecha.</div>';
            } else {
                eventosDelDia.sort((a, b) => a.fecha - b.fecha);

                eventosDelDia.forEach(ev => {
                    const hora = formatearHora(ev.fecha);
                    const horaTxt = hora ? `<i class="fas fa-clock"></i> ${hora}` : '';

                    modalBody.innerHTML += `
                        <div class="event-item">
                            <div class="event-type">${ev.tipoLabel}</div>
                            <div class="event-expediente">Expediente: ${ev.numCausa}</div>
                            <div class="event-details">
                                ${horaTxt} | <i class="fas fa-gavel"></i> ${ev.juzgado}<br>
                                <strong>Carátula:</strong> ${ev.caratula}
                            </div>
                        </div>
                    `;
                });
            }

            eventModal.classList.add('active');
        }

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            eventModal.classList.remove('active');
        });

        eventModal.addEventListener('click', (e) => {
            if (e.target === eventModal) eventModal.classList.remove('active');
        });

        // ====================================================
        // 7. Controles de Navegación del Calendario
        // ====================================================
        document.getElementById('btnPrev').addEventListener('click', () => {
            navDate.setMonth(navDate.getMonth() - 1);
            renderizarCalendario();
        });

        document.getElementById('btnNext').addEventListener('click', () => {
            navDate.setMonth(navDate.getMonth() + 1);
            renderizarCalendario();
        });

        document.getElementById('btnToday').addEventListener('click', () => {
            navDate = new Date();
            renderizarCalendario();
        });

        // ====================================================
        // 8. Inicialización
        // ====================================================
        document.addEventListener('DOMContentLoaded', async () => {
            eventosPlanos = await cargarEventos();
            loadingScreen.style.display = 'none';
            renderizarCalendario();
        });

    </script>
</body>
</html>
