<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Documentos</title>

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Google Fonts: Plus Jakarta Sans (misma tipografía que modulos.html) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

    <script src="https://upload-widget.cloudinary.com/latest/global/all.js"></script>

    <style>
        /* =========================================================
           Variables de diseño (réplica de modulos.html)
           ========================================================= */
        @property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
        @property --arc{syntax:'<angle>';initial-value:70deg;inherits:false}

        :root{
            --pad:clamp(12px,2.6vmin,32px);
            --gap:clamp(12px,2.6vmin,32px);
            --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
            --ink:#0b1f3a;
            --mut:#64748b;
            --bd:#e2e8f0;
            --bg:#eef1f6;
            --card:#ffffff;
            --ac:#2563eb;
            --ac2:#4f46e5;
            --grn:#059669;
            --success:#10b981;
            --danger:#ef4444;
            --warning:#f59e0b;
            --ease:cubic-bezier(.16,1,.3,1);
            --glow:color-mix(in srgb,var(--ac) 32%,transparent);

            /* Tokens originales preservados (por si el JS o markup los usa) */
            --primary-blue:#2563eb;
            --primary-dark-blue:#1d4ed8;
            --status-success:#10b981;
            --secondary-dark-gray:#64748b;
            --text-secondary:#64748b;
            --border-default:#e2e8f0;
            --background-table-header:#f8fafc;
            --caption-size:12px;
            --body-regular-size:14px;
            --font-weight-semibold:600;
            --font-weight-bold:700;

            color-scheme:light;
        }

        @media (prefers-color-scheme:dark){
            :root{
                --ink:#e6eeff;
                --mut:#93a7cb;
                --bd:#1f3560;
                --bg:#071225;
                --card:#0f213f;
                --ac:#60a5fa;
                --ac2:#818cf8;
                --grn:#34d399;
                --success:#34d399;
                --danger:#f87171;
                --warning:#fbbf24;
                --glow:color-mix(in srgb,var(--ac) 42%,transparent);

                --primary-blue:#60a5fa;
                --primary-dark-blue:#818cf8;
                --status-success:#34d399;
                --secondary-dark-gray:#93a7cb;
                --text-secondary:#93a7cb;
                --border-default:#1f3560;
                --background-table-header:color-mix(in srgb,var(--ac) 8%,var(--card));

                color-scheme:dark;
            }
        }

        *{margin:0;padding:0;box-sizing:border-box}

        body{
            font-family:var(--font);
            background-color:var(--bg);
            color:var(--ink);
            line-height:1.5;
            min-height:100vh;
            -webkit-font-smoothing:antialiased;
            text-rendering:optimizeLegibility;
        }

        /* =========================================================
           Header (barra sticky con blur, estilo modulos)
           ========================================================= */
        .header{
            background:color-mix(in srgb,var(--card) 82%,transparent);
            backdrop-filter:blur(14px);
            -webkit-backdrop-filter:blur(14px);
            border-bottom:1px solid var(--bd);
            padding:clamp(14px,2.4vmin,22px) var(--pad);
            position:sticky;
            top:0;
            z-index:100;
            box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 20px -12px rgba(15,23,42,.12);
        }

        .header-content{
            display:flex;
            justify-content:space-between;
            align-items:center;
            max-width:1800px;
            margin:0 auto;
            gap:var(--gap);
            flex-wrap:wrap;
        }

        .logo{
            font-size:clamp(1.15rem,2.6vmin,1.6rem);
            font-weight:800;
            letter-spacing:-.03em;
            background:linear-gradient(135deg,var(--ac),var(--ac2));
            -webkit-background-clip:text;
            background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        .header-buttons{
            display:flex;
            align-items:center;
            flex-wrap:wrap;
            justify-content:flex-end;
            gap:.6rem;
        }

        /* btn-biblioteca: outline pill estilo modulos */
        .btn-biblioteca{
            background-color:transparent;
            border:1.5px solid color-mix(in srgb,var(--ac) 30%,var(--bd));
            color:var(--ac);
            padding:.55rem 1.1rem;
            border-radius:999px;
            font-family:inherit;
            font-size:.85rem;
            font-weight:700;
            letter-spacing:-.01em;
            cursor:pointer;
            text-decoration:none;
            display:inline-flex;
            align-items:center;
            gap:.4rem;
            transition:transform .25s var(--ease),background-color .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease),box-shadow .25s var(--ease);
        }

        .btn-biblioteca:hover{
            background-color:var(--ac);
            color:#fff;
            border-color:var(--ac);
            transform:translateY(-1px);
            box-shadow:0 10px 22px -10px var(--glow);
        }

        /* =========================================================
           Contenedor
           ========================================================= */
        .container{
            max-width:1800px;
            margin:0 auto;
            padding:var(--pad) var(--pad);
            display:flex;
            flex-direction:column;
            gap:var(--gap);
        }

        /* =========================================================
           Tarjeta principal (con arco de luz orbitando, firma modulos)
           ========================================================= */
        .card{
            background-color:var(--card);
            border-radius:clamp(20px,3vmin,32px);
            border:1.5px solid transparent;
            overflow:hidden;
            margin-bottom:0;
            background:
                linear-gradient(var(--card),var(--card)) padding-box,
                conic-gradient(from var(--ang),transparent 0deg,transparent calc(360deg - var(--arc)),#06b6d4 calc(360deg - var(--arc)*.65),#818cf8 calc(360deg - var(--arc)*.3),#4338ca calc(360deg - 4deg),transparent 360deg) border-box;
            box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -16px rgba(15,23,42,.14);
            animation:orbit 9s linear infinite, fadeInUp .6s var(--ease) backwards;
            transition:--arc .5s var(--ease);
        }

        .card:hover{
            --arc:150deg;
        }

        /* Card header: tintado de acento, texto en color de acento */
        .card-header{
            background:color-mix(in srgb,var(--ac) 8%,var(--card));
            color:var(--ac);
            padding:clamp(14px,2vmin,20px) clamp(16px,2.5vmin,24px);
            font-weight:800;
            font-size:clamp(1rem,2.2vmin,1.2rem);
            letter-spacing:-.02em;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:.75rem;
            border-bottom:1px solid var(--bd);
            flex-wrap:wrap;
        }

        /* Botón de subida dentro del header */
        .btn-upload{
            background-color:var(--ac);
            color:#fff;
            border:none;
            border-radius:12px;
            padding:.6rem 1.15rem;
            font-size:.85rem;
            font-weight:700;
            font-family:inherit;
            letter-spacing:-.01em;
            cursor:pointer;
            display:inline-flex;
            align-items:center;
            gap:.4rem;
            transition:transform .25s var(--ease),box-shadow .25s var(--ease),background-color .25s var(--ease);
            box-shadow:0 1px 2px rgba(15,23,42,.04);
        }

        .btn-upload:hover{
            transform:translateY(-1px);
            box-shadow:0 10px 22px -10px var(--glow);
        }

        .btn-upload:active{
            transform:translateY(0);
        }

        .btn-upload:focus-visible{
            outline:2px solid var(--ac);
            outline-offset:2px;
        }

        .card-body{
            padding:clamp(16px,2.5vmin,24px);
        }

        /* =========================================================
           Botones (misma firma visual que modulos)
           ========================================================= */
        .button{
            background-color:var(--ac);
            color:#fff;
            border:none;
            border-radius:12px;
            padding:.6rem 1.15rem;
            font-size:.85rem;
            font-weight:700;
            font-family:inherit;
            letter-spacing:-.01em;
            cursor:pointer;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:.4rem;
            transition:transform .25s var(--ease),box-shadow .25s var(--ease),background-color .25s var(--ease),opacity .25s var(--ease);
            box-shadow:0 1px 2px rgba(15,23,42,.04);
            white-space:nowrap;
        }

        .button:hover{
            transform:translateY(-1px);
            box-shadow:0 10px 22px -10px var(--glow);
        }

        .button:active{
            transform:translateY(0);
        }

        .button:disabled{
            opacity:.4;
            cursor:not-allowed;
            transform:none;
            box-shadow:none;
        }

        .button:focus-visible{
            outline:2px solid var(--ac);
            outline-offset:2px;
        }

        .button-success{
            background-color:var(--success);
        }

        .button-success:hover{
            box-shadow:0 10px 22px -10px color-mix(in srgb,var(--success) 45%,transparent);
        }

        .button-secondary{
            background:transparent;
            border:1.5px solid color-mix(in srgb,var(--ac) 30%,var(--bd));
            color:var(--ac);
            box-shadow:none;
        }

        .button-secondary:hover{
            background:color-mix(in srgb,var(--ac) 8%,transparent);
            border-color:var(--ac);
            box-shadow:none;
        }

        .button-sm{
            padding:.45rem .8rem;
            font-size:.8rem;
            border-radius:10px;
        }

        /* =========================================================
           Controles (búsqueda + paginación + imprimir)
           ========================================================= */
        .controls{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:.75rem;
            margin-bottom:1.25rem;
            flex-wrap:wrap;
        }

        .search-box{
            flex:1;
            min-width:250px;
        }

        .search-box input{
            width:100%;
            padding:.7rem 1rem;
            border:1.5px solid var(--bd);
            border-radius:12px;
            font-size:.9rem;
            font-family:inherit;
            color:var(--ink);
            background:var(--card);
            transition:border-color .25s var(--ease),box-shadow .25s var(--ease);
        }

        .search-box input::placeholder{color:var(--mut)}

        .search-box input:focus{
            outline:none;
            border-color:var(--ac);
            box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 15%,transparent);
        }

        .pagination{
            display:flex;
            align-items:center;
            gap:.6rem;
            flex-wrap:wrap;
        }

        .pagination-info{
            font-size:.85rem;
            color:var(--mut);
            font-weight:600;
        }

        /* =========================================================
           Mensajes
           ========================================================= */
        .message-container{
            margin-bottom:0;
        }

        .message{
            padding:.9rem 1.1rem;
            border-radius:14px;
            display:flex;
            align-items:center;
            gap:.6rem;
            margin-bottom:.5rem;
            font-weight:600;
            font-size:.9rem;
            border:1px solid transparent;
            animation:fadeInUp .4s var(--ease) backwards;
        }

        .message-success{
            background:color-mix(in srgb,var(--success) 12%,transparent);
            color:var(--success);
            border-color:color-mix(in srgb,var(--success) 30%,transparent);
        }

        .message-error{
            background:color-mix(in srgb,var(--danger) 12%,transparent);
            color:var(--danger);
            border-color:color-mix(in srgb,var(--danger) 30%,transparent);
        }

        .message-info{
            background:color-mix(in srgb,var(--ac) 12%,transparent);
            color:var(--ac);
            border-color:color-mix(in srgb,var(--ac) 30%,transparent);
        }

        /* =========================================================
           Loading
           ========================================================= */
        .loading{
            display:none;
            text-align:center;
            padding:2rem;
            color:var(--ac);
            font-weight:700;
            font-size:.95rem;
        }

        .spinner{
            display:inline-block;
            width:20px;
            height:20px;
            border:3px solid color-mix(in srgb,var(--bd) 60%,transparent);
            border-top:3px solid var(--ac);
            border-radius:50%;
            animation:spin 1s linear infinite;
            margin-right:.4rem;
            vertical-align:middle;
        }

        @keyframes spin{
            0%{transform:rotate(0deg)}
            100%{transform:rotate(360deg)}
        }

        /* =========================================================
           Tabla
           ========================================================= */
        .table-container{
            overflow-x:auto;
            border-radius:14px;
            border:1px solid var(--bd);
        }

        table{
            width:100%;
            border-collapse:collapse;
            min-width:800px;
        }

        th{
            background:color-mix(in srgb,var(--ac) 6%,var(--card));
            font-weight:700;
            border-bottom:1px solid var(--bd);
            padding:12px 14px;
            color:var(--ac);
            font-size:11px;
            text-transform:uppercase;
            letter-spacing:.05em;
            text-align:left;
        }

        td{
            border-bottom:1px solid color-mix(in srgb,var(--bd) 60%,transparent);
            padding:12px 14px;
            color:var(--ink);
            font-size:14px;
            vertical-align:middle;
        }

        tr:last-child td{
            border-bottom:none;
        }

        tr{transition:background-color .2s var(--ease)}
        tr:hover td{
            background:color-mix(in srgb,var(--ac) 4%,var(--card));
        }

        .file-info{
            display:flex;
            align-items:center;
            gap:.9rem;
        }

        .file-icon{
            font-size:1.4rem;
            width:40px;
            height:40px;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            border-radius:12px;
            background:color-mix(in srgb,var(--ac) 10%,transparent);
            color:var(--ac);
            flex-shrink:0;
            transition:transform .25s var(--ease),background-color .25s var(--ease);
        }

        tr:hover .file-icon{
            transform:scale(1.06);
        }

        .file-icon.pdf { color:#ef4444; background:color-mix(in srgb,#ef4444 12%,transparent); }
        .file-icon.doc { color:#3b82f6; background:color-mix(in srgb,#3b82f6 12%,transparent); }
        .file-icon.docx { color:#3b82f6; background:color-mix(in srgb,#3b82f6 12%,transparent); }
        .file-icon.xls { color:#10b981; background:color-mix(in srgb,#10b981 12%,transparent); }
        .file-icon.xlsx { color:#10b981; background:color-mix(in srgb,#10b981 12%,transparent); }
        .file-icon.ppt { color:#f59e0b; background:color-mix(in srgb,#f59e0b 12%,transparent); }
        .file-icon.pptx { color:#f59e0b; background:color-mix(in srgb,#f59e0b 12%,transparent); }
        .file-icon.image { color:#8b5cf6; background:color-mix(in srgb,#8b5cf6 12%,transparent); }
        .file-icon.default { color:var(--mut); background:color-mix(in srgb,var(--mut) 12%,transparent); }

        .file-details h4{
            font-weight:700;
            color:var(--ink);
            margin-bottom:.15rem;
            font-size:.9rem;
            letter-spacing:-.01em;
        }

        .file-details p{
            font-size:.8rem;
            color:var(--mut);
        }

        .actions{
            display:flex;
            gap:.4rem;
            flex-wrap:wrap;
        }

        .no-documents{
            text-align:center;
            padding:3rem 1rem;
            color:var(--mut);
        }

        .no-documents i{
            font-size:2.5rem;
            margin-bottom:1rem;
            color:var(--mut);
            opacity:.6;
        }

        .no-documents p{
            font-weight:600;
            color:var(--ink);
            margin-bottom:.25rem;
        }

        .no-documents small{
            font-size:.85rem;
            color:var(--mut);
        }

        #fileInput{
            display:none;
        }

        /* =========================================================
           Animaciones
           ========================================================= */
        @keyframes orbit{to{--ang:360deg}}

        @keyframes fadeInUp{
            from{opacity:0;transform:translateY(20px) scale(.98)}
            to{opacity:1;transform:none}
        }

        @media (prefers-reduced-motion:reduce){
            .card,
            .message{
                animation:none !important;
            }
            .card{
                background:var(--card);
                border:1.5px solid var(--ac);
            }
        }

        /* =========================================================
           Responsive
           ========================================================= */
        @media (max-width:1024px){
            .container{max-width:100%;padding:calc(var(--pad)*.75)}
        }

        @media (max-width:768px){
            .header-content{
                flex-direction:column;
                text-align:center;
            }
            .header-buttons{justify-content:center}
            .controls{flex-direction:column;align-items:stretch}
            .pagination{justify-content:center}
            .actions{justify-content:center}
            .card-header{
                flex-direction:column;
                text-align:center;
            }
        }

        @media (max-width:576px){
            .container{padding:calc(var(--pad)*.5)}
            .card-header,
            .card-body{padding:14px}
            th, td{padding:10px}
            .btn-biblioteca{font-size:.75rem;padding:.45rem .9rem}
            .btn-upload{font-size:.8rem;padding:.5rem 1rem}
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">Biblioteca</div>
            <div class="header-buttons">
                <a href="https://defensorialocal-seis.github.io/ayuda-plazos/" class="btn-biblioteca" target="_self">Legislacion y Plazos Procesales</a>
                <a href="https://experiencia-ia.github.io/biblioteca-doctrina-jurisprudencia/" class="btn-biblioteca" target="_self">Biblioteca de Doctrina y Jurisprudencia</a>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Panel de subida eliminado -->

        <div id="messageContainer" class="message-container"></div>

        <div id="loadingIndicator" class="loading">
            <div class="spinner"></div>
            Procesando...
        </div>

        <div class="card">
            <div class="card-header">
                <span>Documentos de la Biblioteca de la Defensoría</span>
                <button class="btn-upload" id="uploadButton">Subir nuevo documento</button>
            </div>
            <div class="card-body">
                <div class="controls">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Buscar documentos...">
                    </div>
                    <div class="pagination">
                        <button class="button button-secondary button-sm" id="prevPage">Anterior</button>
                        <span class="pagination-info" id="pageInfo">Página 1 de 1</span>
                        <button class="button button-secondary button-sm" id="nextPage">Siguiente</button>
                    </div>
                    <button class="button button-success button-sm" onclick="documentManager.printDocumentList()">Imprimir</button>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Documento</th>
                                <th>Fecha de Subida</th>
                                <th>Tamaño</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="documentsTableBody">
                            <tr>
                                <td colspan="4" class="no-documents">
                                    <i class="fas fa-folder-open"></i>
                                    <p>No hay documentos almacenados</p>
                                    <small>Sube tu primer documento usando el botón de arriba</small>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="pagination">
                    <span class="pagination-info" id="totalElements">Total: 0 elementos</span>
                </div>
            </div>
        </div>

        <input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx">
    </main>

    <script type="module">
        // Firebase SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCpPdY984mCYWQodeqA6ZVXFxedalExc34",
            authDomain: "repositorio-documentos.firebaseapp.com",
            projectId: "repositorio-documentos",
            storageBucket: "repositorio-documentos.firebasestorage.app",
            messagingSenderId: "359488594361",
            appId: "1:359488594361:web:421264bbc3c5f8f7c01668"
        };

        // Configuración de Cloudinary
        const CLOUDINARY_CONFIG = {
            cloudName: 'dbzucruu4',
            uploadPreset: 'documentos_defensoria'
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Utilidades
        function showMessage(message, type = 'info') {
            const messageDiv = document.getElementById('messageContainer');
            messageDiv.innerHTML = `
                <div class="message message-${type}">
                    <i class="fas ${type === 'error' ? 'fa-exclamation-circle' : type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i>
                    ${message}
                </div>
            `;
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 5000);
        }

        function showLoading(show = true) {
            const loadingDiv = document.getElementById('loadingIndicator');
            loadingDiv.style.display = show ? 'block' : 'none';
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const iconMap = {
                'pdf': { icon: 'fa-file-pdf', class: 'pdf' },
                'doc': { icon: 'fa-file-word', class: 'doc' },
                'docx': { icon: 'fa-file-word', class: 'docx' },
                'xls': { icon: 'fa-file-excel', class: 'xls' },
                'xlsx': { icon: 'fa-file-excel', class: 'xlsx' },
                'ppt': { icon: 'fa-file-powerpoint', class: 'ppt' },
                'pptx': { icon: 'fa-file-powerpoint', class: 'pptx' },
                'jpg': { icon: 'fa-file-image', class: 'image' },
                'jpeg': { icon: 'fa-file-image', class: 'image' },
                'png': { icon: 'fa-file-image', class: 'image' },
                'gif': { icon: 'fa-file-image', class: 'image' }
            };
            return iconMap[ext] || { icon: 'fa-file', class: 'default' };
        }

        // Gestor de documentos
        class DocumentManager {
            constructor() {
                this.documents = [];
                this.filteredDocuments = [];
                this.collectionRef = collection(db, "documents");
                this.currentPage = 1;
                this.itemsPerPage = 10;
                this.searchTerm = '';
                this.init();
            }

            async init() {
                try {
                    await this.loadDocuments();
                    this.setupFileUpload();
                    this.setupSearch();
                    this.setupPagination();
                    showMessage('Sistema inicializado correctamente', 'success');
                } catch (error) {
                    console.error('Error al inicializar:', error);
                    showMessage('Error al inicializar el sistema', 'error');
                }
            }

            async loadDocuments() {
                try {
                    showLoading(true);
                    const q = query(this.collectionRef, orderBy("uploadedAt", "desc"));
                    const snapshot = await getDocs(q);
                    this.documents = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    this.applyFilter();
                    this.renderTable();
                    this.updatePaginationInfo();
                } catch (error) {
                    console.error('Error al cargar documentos:', error);
                    showMessage('Error al cargar los documentos', 'error');
                } finally {
                    showLoading(false);
                }
            }

            setupSearch() {
                const searchInput = document.getElementById('searchInput');
                searchInput.addEventListener('input', (e) => {
                    this.searchTerm = e.target.value.toLowerCase();
                    this.currentPage = 1;
                    this.applyFilter();
                    this.renderTable();
                    this.updatePaginationInfo();
                });
            }

            setupPagination() {
                document.getElementById('prevPage').addEventListener('click', () => {
                    if (this.currentPage > 1) {
                        this.currentPage--;
                        this.renderTable();
                        this.updatePaginationInfo();
                    }
                });

                document.getElementById('nextPage').addEventListener('click', () => {
                    const totalPages = Math.ceil(this.filteredDocuments.length / this.itemsPerPage);
                    if (this.currentPage < totalPages) {
                        this.currentPage++;
                        this.renderTable();
                        this.updatePaginationInfo();
                    }
                });
            }

            applyFilter() {
                if (!this.searchTerm) {
                    this.filteredDocuments = [...this.documents];
                } else {
                    this.filteredDocuments = this.documents.filter(doc =>
                        doc.name.toLowerCase().includes(this.searchTerm) ||
                        doc.description.toLowerCase().includes(this.searchTerm)
                    );
                }
            }

            updatePaginationInfo() {
                const totalPages = Math.ceil(this.filteredDocuments.length / this.itemsPerPage);
                const totalElements = this.filteredDocuments.length;

                document.getElementById('pageInfo').textContent =
                    `Página ${this.currentPage} de ${totalPages || 1}`;
                document.getElementById('totalElements').textContent =
                    `Total: ${totalElements} elementos`;

                document.getElementById('prevPage').disabled = this.currentPage === 1;
                document.getElementById('nextPage').disabled = this.currentPage === totalPages || totalPages === 0;
            }

            setupFileUpload() {
                const uploadBtn = document.getElementById("uploadButton");
                const fileInput = document.getElementById("fileInput");

                uploadBtn.addEventListener("click", () => {
                    fileInput.click();
                });

                fileInput.addEventListener("change", (e) => {
                    this.handleFileSelection(e.target.files);
                });
            }

            async handleFileSelection(files) {
                if (!files.length) return;

                const allowedTypes = ['application/pdf', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
                const validFiles = Array.from(files).filter(file =>
                    allowedTypes.includes(file.type) ||
                    file.name.toLowerCase().endsWith('.pdf') ||
                    file.name.toLowerCase().endsWith('.doc') ||
                    file.name.toLowerCase().endsWith('.docx')
                );

                if (validFiles.length === 0) {
                    showMessage('Solo se permiten archivos PDF y DOC/DOCX', 'error');
                    return;
                }

                if (validFiles.length !== files.length) {
                    showMessage(`Se procesarán ${validFiles.length} de ${files.length} archivos (solo PDF y DOC)`, 'info');
                }

                showMessage(`Subiendo ${validFiles.length} archivo(s) a Cloudinary...`, 'info');
                showLoading(true);

                for (const file of validFiles) {
                    try {
                        await this.uploadFileToCloudinary(file);
                    } catch (error) {
                        console.error('Error al subir archivo:', error);
                        showMessage(`Error al subir ${file.name}`, 'error');
                    }
                }

                showLoading(false);
                document.getElementById("fileInput").value = '';
            }

            async uploadFileToCloudinary(file) {
                return new Promise((resolve, reject) => {
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('upload_preset', CLOUDINARY_CONFIG.uploadPreset);
                    formData.append('resource_type', 'auto');

                    fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CONFIG.cloudName}/auto/upload`, {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => response.json())
                    .then(async (result) => {
                        if (result.error) {
                            throw new Error(result.error.message);
                        }

                        const docData = {
                            name: result.original_filename + '.' + result.format,
                            description: `Documento subido desde dispositivo local`,
                            size: result.bytes,
                            uploadedAt: new Date().toISOString(),
                            url: result.secure_url,
                            cloudinaryId: result.public_id,
                            fileType: result.resource_type,
                            format: result.format
                        };

                        await addDoc(this.collectionRef, docData);
                        await this.loadDocuments();
                        showMessage(`${file.name} subido exitosamente`, 'success');
                        resolve(result);
                    })
                    .catch(error => {
                        console.error('Error en Cloudinary:', error);
                        reject(error);
                    });
                });
            }

            async editDocument(id, currentName, currentDescription) {
                const newName = prompt('Nuevo nombre del documento:', currentName);
                if (newName === null) return;

                const newDescription = prompt('Nueva descripción del documento:', currentDescription);
                if (newDescription === null) return;

                try {
                    showLoading(true);
                    await updateDoc(doc(db, "documents", id), {
                        name: newName,
                        description: newDescription
                    });
                    await this.loadDocuments();
                    showMessage('Documento actualizado correctamente', 'success');
                } catch (error) {
                    console.error('Error al actualizar documento:', error);
                    showMessage('Error al actualizar el documento', 'error');
                } finally {
                    showLoading(false);
                }
            }

            downloadDocument(url, filename) {
                try {
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = filename;
                    link.target = '_blank';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showMessage(`Descargando ${filename}...`, 'success');
                } catch (error) {
                    console.error('Error al descargar:', error);
                    showMessage('Error al descargar el archivo', 'error');
                }
            }

            printDocumentList() {
                const printWindow = window.open('', '_blank');
                const currentDate = new Date().toLocaleDateString('es-ES');

                let printContent = `
                    <html>
                        <head>
                            <title>Listado de Documentos</title>
                            <style>
                                body { font-family: Arial, sans-serif; margin: 20px; }
                                h1 { text-align: center; margin-bottom: 20px; }
                                .header-info { margin-bottom: 20px; }
                                table { width: 100%; border-collapse: collapse; }
                                th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
                                th { background-color: #f2f2f2; font-weight: bold; }
                                .footer { margin-top: 20px; text-align: center; }
                            </style>
                        </head>
                        <body>
                            <h1>Listado de Documentos</h1>
                            <div class="header-info">
                                <p><strong>Fecha de impresión:</strong> ${currentDate}</p>
                                <p><strong>Total de elementos:</strong> ${this.filteredDocuments.length}</p>
                            </div>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Nombre del Documento</th>
                                        <th>Descripción</th>
                                        <th>Fecha de Subida</th>
                                        <th>Tamaño</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;

                this.filteredDocuments.forEach(doc => {
                    const fecha = new Date(doc.uploadedAt).toLocaleDateString("es-ES");
                    const fileSize = formatFileSize(doc.size);

                    printContent += `
                        <tr>
                            <td>${doc.name}</td>
                            <td>${doc.description}</td>
                            <td>${fecha}</td>
                            <td>${fileSize}</td>
                        </tr>
                    `;
                });

                printContent += `
                                </tbody>
                            </table>
                            <div class="footer">
                                <p>Sistema de Gestión de Documentos</p>
                            </div>
                        </body>
                    </html>
                `;

                printWindow.document.write(printContent);
                printWindow.document.close();
                printWindow.print();
            }

            renderTable() {
                const tbody = document.getElementById("documentsTableBody");

                if (!this.filteredDocuments.length) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="4" class="no-documents">
                                <i class="fas fa-folder-open"></i>
                                <p>No hay documentos almacenados</p>
                                <small>Sube tu primer documento usando el botón de arriba</small>
                            </td>
                        </tr>
                    `;
                    return;
                }

                const startIndex = (this.currentPage - 1) * this.itemsPerPage;
                const endIndex = startIndex + this.itemsPerPage;
                const pageDocuments = this.filteredDocuments.slice(startIndex, endIndex);

                tbody.innerHTML = pageDocuments.map(doc => {
                    const fecha = new Date(doc.uploadedAt).toLocaleString("es-ES", {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    const fileSize = formatFileSize(doc.size);
                    const fileIcon = getFileIcon(doc.name);

                    return `
                        <tr>
                            <td>
                                <div class="file-info">
                                    <div class="file-icon ${fileIcon.class}">
                                        <i class="fas ${fileIcon.icon}"></i>
                                    </div>
                                    <div class="file-details">
                                        <h4>${doc.name}</h4>
                                        <p>${doc.description}</p>
                                    </div>
                                </div>
                            </td>
                            <td>${fecha}</td>
                            <td>${fileSize}</td>
                            <td>
                                <div class="actions">
                                    <button class="button button-sm" onclick="documentManager.downloadDocument('${doc.url}', '${doc.name}')" title="Descargar">
                                        <i class="fas fa-download"></i>
                                    </button>
                                    <button class="button button-secondary button-sm" onclick="documentManager.editDocument('${doc.id}', '${doc.name}', '${doc.description}')" title="Editar">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            window.documentManager = new DocumentManager();
        });
    </script>
</body>
</html>
