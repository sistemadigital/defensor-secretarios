<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Guía Policial 2026 · Misiones</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07121f;--card:#0e1d30;--tx:#e9f1fa;--mu:#9bb0c8;--bd:#1c3350;--ce:#5cc3ec;--rj:#ff4a63;--nv:#020a14;--in:#12283f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07121f;--card:#0e1d30;--tx:#e9f1fa;--mu:#9bb0c8;--bd:#1c3350;--ce:#5cc3ec;--rj:#ff4a63;--nv:#020a14;--in:#12283f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.55 'Public Sans',system-ui,sans-serif}
.hero{background:#0b2a4a;color:#fff;padding:22px 20px 68px}
.hero i{position:absolute;display:block;transform:skewY(30deg);opacity:.95}
.b1{background:var(--ce);width:46vw;height:90px;right:-6vw;top:20px;animation:slide .9s cubic-bezier(.2,.8,.2,1) both}
.b2{background:var(--rj);width:30vw;height:90px;right:30vw;top:78px;animation:slide .9s .15s cubic-bezier(.2,.8,.2,1) both}
.b3{background:#000;width:22vw;height:90px;right:8vw;top:160px;animation:slide .9s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes slide{from{transform:skewY(30deg) translateX(80px);opacity:0}}
.w{max-width:1120px;margin:0 auto;position:relative}
h1{font:900 clamp(26px,5vw,38px)/1.1 'Big Shoulders Display',Impact,sans-serif;margin:0;letter-spacing:.5px}
.hero p{max-width:46ch;margin:0;color:#cfe3f3;font-size:17px}
.tg{position:absolute;right:0;top:-34px;border:1px solid #ffffff55;background:#0006;color:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.st{display:flex;gap:28px;margin-top:30px;flex-wrap:wrap}.st b{display:block;font:900 40px/1 'Big Shoulders Display',sans-serif}.st span{font-size:14px;color:#cfe3f3}
.ct{max-width:1120px;margin:-44px auto 0;padding:0 16px;position:relative}
.bar{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;display:grid;gap:12px;grid-template-columns:2fr 1fr 1fr;box-shadow:0 18px 40px #0a2a5522}
.bar input,.bar select{width:100%;font:inherit;color:var(--tx);background:var(--in);border:2px solid transparent;border-radius:10px;padding:12px 14px;outline:0;transition:border-color .2s}
.bar input:focus,.bar select:focus{border-color:var(--ce)}
.ch{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ch button{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:99px;padding:7px 16px;cursor:pointer;transition:.2s}
.ch button[aria-pressed=true]{background:var(--nv);color:#fff;border-color:var(--nv)}
.ch em{margin-left:auto;font-style:normal;color:var(--mu);font-size:14px}
#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin:22px 0 60px}
.cd{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--ce);border-radius:12px;padding:16px 18px;display:block;transition:transform .2s,box-shadow .2s;animation:up .5s both}
.cd.c{border-left-color:var(--rj)}.cd:hover,.cd:focus-visible{transform:translateY(-4px);box-shadow:0 14px 30px #0a2a5530}.cd:focus-visible{outline:3px solid var(--ce);outline-offset:2px}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.cd h3{margin:0 0 2px;font:700 22px/1.1 'Big Shoulders Display',sans-serif}.cd small{color:var(--mu)}.cd p{margin:10px 0 0;font-size:14px}.cd p b{font-weight:600}
.tl{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;color:var(--ce)}
.em{text-align:center;color:var(--mu);padding:50px 10px;grid-column:1/-1}
#m{position:fixed;inset:0;background:#020a14aa;display:none;align-items:flex-end;justify-content:center;z-index:9;backdrop-filter:blur(4px)}
#m.o{display:flex;animation:fd .25s}@keyframes fd{from{opacity:0}}
.pn{background:var(--card);width:min(560px,100%);border-radius:20px 20px 0 0;padding:26px 24px calc(26px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:sh .35s cubic-bezier(.2,.8,.2,1)}
@keyframes sh{from{transform:translateY(60px);opacity:0}}
@media(min-width:640px){#m{align-items:center}.pn{border-radius:20px}}
.pn h2{font:900 34px/1 'Big Shoulders Display',sans-serif;margin:0 0 4px}.pn dl{margin:18px 0}.pn dt{font-size:13px;color:var(--mu);margin-top:12px}.pn dd{margin:2px 0 0;font-weight:500}
.ac{display:flex;gap:10px;flex-wrap:wrap}.ac a,.ac button{font:inherit;font-weight:600;text-decoration:none;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--ce);color:#fff}
.ac .s{background:var(--in);color:var(--tx)}.x{float:right;background:var(--in)!important;color:var(--tx)!important;border-radius:50%!important;width:38px;height:38px;padding:0!important}
@media(max-width:720px){.bar{grid-template-columns:1fr}.b3{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header class="hero"><div class="w">

<h1>Policía de Misiones</h1>
</div></header>

<script>
// [id, ciudad, jefe, 2.º jefe, dirección, teléfono]

['VI','Leandro N. Alem','Crio. Gral. Juan Rafael Kubiszen','Crio. My. Hugo Manuel Fleitas','Av. Libertador 70','(03754) 420774'],

['IX','Jardín América','Crio. Gral. Marcelo Aníbal Chimiski','Crio. My. Javier José María Rodríguez','Av. Aconcagua 12','(03743) 460270'],
['X','Posadas','Crio. Gral. Francisco Horacio Esquivel','Crio. Insp. Carlos Alberto Benítez Ríos','Complejo Habitacional A-4','3764-102189'],

// [ur, nombre, jefe, 2.º jefe, dirección, teléfono, ciudad?]
const C=[
['I','Comisaría Primera','Crio. Juan Carlos Acosta','Crio. Jorge Omar Barboza','Alberdi 935, esq. Moritán','Centrex 7652'],
['I','Comisaría Segunda','Crio. Cristian Exequiel Denis','Subcrio. Cristina Noelia Alejandra Dominguez','Av. Tambor de Tacuarí 3523','Centrex 7653'],
['I','Comisaría Tercera','Crio. Diego Javier Camargo','Subcrio. Mario Julián Leguizamón','Av. Uruguay 3534, casi Ambrosetti','Centrex 8939'],
['I','Comisaría Cuarta','Crio. Sonia Mirta Dominguez','Subcrio. César Adrián Ramírez','Madariaga 1103, esq. Lanusse','(0376) 4-447657'],
['I','Comisaría Sexta','Crio. Vanesa Griselda Núñez','Of. Ppal. Atilio Ubaldo Miño','Ch. 103, Av. Blas Parera 5057','(0376) 4-468005'],

['I','Comisaría de la Mujer','Crio. Analía Vanesa Torres','Of. Ppal. Tatiana Báez','Félix de Azara y Córdoba','(0376) 4-447690'],
['X','Comisaría Quinta','Crio. Viviana Raquel Aguayo','Subcrio. Damián Nicolás Dujaut','Villalonga, colectora Ntra. Sra. del Rosario','(0376) 4488410'],
['X','Comisaría Octava','Crio. Raúl Omar Ríos','Subcrio. Walter Elías Leguizamón','Calle 144 y 57, Bº San Jorge','(0376) 4458245'],
['X','Comisaría Novena','Crio. Juan Argentino Acuña','Of. Ppal. Fabrizio Germán Malveira','Av. 147 esq. 160, Itaembé Miní','(0376) 4458281'],
['X','Comisaría Décima','Crio. Miguel Ángel Da Silva','Of. Ppal. César Oscar Pereyra','Calle 35 Los Tulipanes esq. 164','(0376) 4488420'],
['X','Comisaría de Garupá','Crio. Marcelo Darío Lovera','Crio. Marcelo Rodolfo De Asís','San Martín s/n, entre Belgrano y Rivadavia','(0376) 4491004','Garupá'],
['X','Comisaría de Candelaria','Crio. Juan Gabriel Martínez','Subcrio. Juan Carlos Píriz','Av. Roque Sáenz Peña y Anastasio Cabrera 793','Centrex 8119','Candelaria'],
['II','Comisaría Primera','Crio. Viviana Raquel Romero','Sin dato en la guía','Av. Sarmiento 812','3755-421135'],
['II','Comisaría Segunda','Crio. Edgardo Basilio Czaban','Subcrio. Cristian Sebastián Pedrozo','Uruguay y Chacabuco','(03755) 422524'],
['III','Comisaría Primera','Crio. Mauricio Santiago Benítez','Subcrio. Patricia Luciana Gal','Av. Córdoba y Paraguay, Km 9','(03751) 421222'],
['III','Comisaría Segunda','Subcrio. Yamila Noelia Rojas','Of. Aux. José Leandro Lemos','Av. San Martín 2780, Km 2','(03751) 431222'],
['IV','Comisaría Primera','Crio. Insp. Damián Andrés Gurawski','Subcrio. Duarte Augusto Facundo','Laprida y Sarmiento','(03743) 420594'],
['V','Comisaría Primera','Crio. César Manuel Antúnez','Of. Aux. Sergio Nicolás Villalba','Av. San Martín y Victoria Aguirre','(03757) 440606'],
['V','Comisaría Segunda','Subcrio. Eduardo Fabián Escobar','Of. Aux. Rita Micaela Payong','Av. República Argentina y Héctor Cámpora','3757-463945'],
['VI','Comisaría Primera','Crio. Omar Esequiel González','Of. Aux. Dante Ezequiel Schwoerer','Av. del Libertador 70 y Urquiza 98','(03754) 420101'],
['VII','Comisaría Primera','Crio. Carlos Ariel Ferraz','Of. Aux. Hugo Maximiliano Martínez','Mariano Moreno y Mitre 749','(03758) 422555'],
['VIII','Comisaría Primera','Of. Ppal. Fernando Sebastián Acuña','Of. Ayte. Juan Gabriel Benítez','Democracia 211, esq. Perón','Centrex 3181'],
['IX','Comisaría de Jardín América','Crio. Héctor Matías Sánchez','Of. Aux. Fátima Alexandra Galbán','Aconcagua 12','(03743) 460272'],
['XI','Comisaría Primera','Of. Ppal. Leonardo Jonas Oliveira','Of. Ppal. Gisella Alejandra Soto','Av. de las Américas 1115','(03755) 671136'],

['XIII','Comisaría de San Ignacio','Subcrio. Sebastián Mauricio Czerevin','Of. Ppal. Ernesto Sebastián Espíndola','Av. San Martín 1091','(3743) 857190'],
['XIV','Comisaría Primera','Of. Ppal. Alejandro Frank Núñez','Of. Ayte. Camila Marisel Borges de Figueredo','Av. Güemes y Almirante Brown','(03751) 470111'],
['XV','Comisaría de Montecarlo','Subcrio. Julio César Cabrera','Of. Ayte. Federico Nicolás Aquino','Av. Libertador 1163','(03751) 480100']];
const ex=s=>s.replace('Subcrio.','Subcomisario').replace('Crio.','Comisario').replace(' My.',' Mayor').replace(' Insp.',' Inspector').replace(' Gral.',' General').replace('Of. Ppal.','Oficial Principal').replace('Of. Aux.','Oficial Auxiliar').replace('Of. Ayte.','Oficial Ayudante');
const cu=Object.fromEntries(UR.map(u=>[u[0],u[1]]));
const D=[...UR.map(u=>({t:'u',ur:u[0],ci:u[1],n:'Unidad Regional '+u[0],j:u[2],s:u[3],d:u[4],f:u[5]})),
...C.map(c=>({t:'c',ur:c[0],ci:c[6]||cu[c[0]],n:c[1],j:c[2],s:c[3],d:c[4],f:c[5]}))];
const $=i=>document.getElementById(i),nz=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let T='';
const cities=[...new Set(D.map(x=>x.ci))].sort((a,b)=>a.localeCompare(b,'es'));
$('fc').innerHTML='<option value="">Todas las ciudades</option>'+cities.map(c=>`<option>${c}</option>`).join('');
$('fu').innerHTML='<option value="">Todas las unidades</option>'+UR.map(u=>`<option value="${u[0]}">UR-${u[0]} · ${u[1]}</option>`).join('');
function render(){
 const q=nz($('q').value.trim()),c=$('fc').value,u=$('fu').value;
 const r=D.filter(x=>(!T||x.t===T)&&(!c||x.ci===c)&&(!u||x.ur===u)&&(!q||nz([x.n,x.ci,x.j,x.s,x.d,x.f,'ur '+x.ur].join(' ')).includes(q)));
 $('cnt').textContent=r.length+(r.length===1?' resultado':' resultados');
 $('g').innerHTML=r.length?r.map((x,i)=>`<button class="cd ${x.t}" style="animation-delay:${Math.min(i,14)*35}ms" data-i="${D.indexOf(x)}"><h3>${x.n}</h3><small>${x.ci} · UR-${x.ur}</small><p><b>${ex(x.j)}</b></p><span class="tl">${x.f}</span></button>`).join(''):'<div class="em">No hay dependencias con esos filtros. Probá con otra palabra o quitá un filtro.</div>';
}
['q','fc','fu'].forEach(i=>$(i).addEventListener('input',render));
$('ch').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;T=b.dataset.t;[...$('ch').querySelectorAll('button')].forEach(k=>k.setAttribute('aria-pressed',k===b));render()});
const m=$('m');
$('g').addEventListener('click',e=>{const b=e.target.closest('.cd');if(!b)return;const x=D[b.dataset.i];
 const tel=/^Centrex/.test(x.f)?'':`<a href="tel:${x.f.replace(/[^\d+]/g,'')}">Llamar</a>`;
 $('pn').innerHTML=`<button class="x" id="xx" aria-label="Cerrar">✕</button><h2>${x.n}</h2><small>${x.t==='u'?'Unidad regional':'Comisaría'} · ${x.ci} · UR-${x.ur}</small>
 <dl><dt>Jefe</dt><dd>${ex(x.j)}</dd><dt>Segundo jefe</dt><dd>${ex(x.s)}</dd><dt>Dirección</dt><dd>${x.d}, ${x.ci}</dd><dt>Teléfono</dt><dd>${x.f}</dd></dl>
 <div class="ac">${tel}<a class="s" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.d+', '+x.ci+', Misiones')}">Ver en el mapa</a><button class="s" id="cp">Copiar datos</button></div>`;
 m.classList.add('o');$('xx').focus();
 $('cp').onclick=()=>{const t=`${x.n} (${x.ci})\nJefe: ${ex(x.j)}\n2.º jefe: ${ex(x.s)}\nDirección: ${x.d}\nTel: ${x.f}`;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>$('cp').textContent='Datos copiados',()=>$('cp').textContent='No se pudo copiar');};
});
const cl=()=>m.classList.remove('o');
m.addEventListener('click',e=>{if(e.target===m||e.target.id==='xx')cl()});
addEventListener('keydown',e=>{if(e.key==='Escape')cl();if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('q').focus()}});


render();
</script></body></html>
