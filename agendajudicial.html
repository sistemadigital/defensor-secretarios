<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda Judicial · Guía de Autoridades 2026</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f8fb;--card:#fff;--ink:#18213a;--mute:#64708a;--rule:#cfd6e4;--navy:#1b2a52;--nink:#e8edf9;--amber:#e8a920;--blue:#2c4a9a;--side:#e9eef6;--hl:#ffe08a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0f1527;--card:#162039;--ink:#e7ecf8;--mute:#93a0bd;--rule:#27304a;--navy:#0a1020;--side:#121a30;--blue:#8fb0ff;--hl:#6b5512}}
:root[data-theme="dark"]{--paper:#0f1527;--card:#162039;--ink:#e7ecf8;--mute:#93a0bd;--rule:#27304a;--navy:#0a1020;--side:#121a30;--blue:#8fb0ff;--hl:#6b5512}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:14.5px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.top{display:flex;gap:14px;align-items:center;padding:10px 18px;background:var(--navy);color:var(--nink);border-bottom:3px solid var(--amber)}
.brand{font:700 18px "Source Serif 4",Georgia,serif;white-space:nowrap}.brand small{display:block;font:400 11.5px "IBM Plex Sans",sans-serif;opacity:.7}
.sw{flex:1;position:relative;max-width:720px}
.sw input{width:100%;font:inherit;font-size:16px;padding:11px 40px 11px 14px;border:0;border-radius:8px;background:#fff;color:#18213a}
.sw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:22px;color:#64708a;cursor:pointer;padding:4px 10px}
.cnt{font-size:12.5px;opacity:.8;white-space:nowrap}.tg{display:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
.shell{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr) 240px}
.left{background:var(--navy);color:var(--nink);overflow:auto}
.right{background:var(--side);overflow:auto;border-left:1px solid var(--rule);padding:14px 12px}
.main{overflow:auto;scroll-behavior:smooth;padding:0 22px 60px}
.az{position:sticky;top:0;z-index:2;background:var(--navy);display:flex;flex-wrap:wrap;gap:2px;padding:10px 10px 8px;border-bottom:1px solid #ffffff22}
.az button{width:25px;height:25px;border:0;border-radius:5px;background:#ffffff14;color:var(--nink);font:600 12px inherit;cursor:pointer}
.az button:hover{background:var(--amber);color:#18213a}
.ll{padding:0 8px 24px}.ll h4{margin:14px 6px 4px;font:700 17px "Source Serif 4",serif;color:var(--amber)}
.ll a{display:block;color:var(--nink);text-decoration:none;font-size:13px;padding:5px 8px;border-radius:5px;line-height:1.3}
.ll a:hover{background:#ffffff1a}.ll a small{opacity:.6;font-size:11.5px}
.right h3{margin:0 0 8px;font:700 16px "Source Serif 4",serif}
.right h5{margin:14px 4px 4px;font-size:12px;font-weight:600;color:var(--mute)}
.ct{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;font:inherit;font-size:13.5px;padding:7px 10px;margin:1px 0;border:0;border-radius:6px;background:none;color:var(--ink);cursor:pointer}
.ct:hover{background:var(--rule)}.ct[aria-pressed=true]{background:var(--navy);color:var(--nink)}.ct b{font-weight:500;opacity:.7}.ct.z{opacity:.4}
.grp{position:sticky;top:0;z-index:1;margin:0 -22px;padding:18px 22px 8px;background:var(--paper);font:700 25px/1.2 "Source Serif 4",Georgia,serif;border-bottom:2px solid var(--navy)}
.grp small{font:400 12.5px "IBM Plex Sans",sans-serif;color:var(--mute);margin-left:8px}
.sub{margin:16px 0 0;font-weight:600;color:var(--blue);font-size:14px}
.ent{background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--amber);border-radius:6px;margin:12px 0;padding:12px 16px 10px;max-width:880px;scroll-margin-top:70px}
.ent header{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:6px}
.ent h3{margin:0;font:600 17px/1.3 "Source Serif 4",Georgia,serif}
.meta{font-size:12px;color:var(--mute);white-space:nowrap}.meta button{font:inherit;font-size:12px;margin-left:8px;border:1px solid var(--rule);background:none;color:var(--ink);border-radius:5px;padding:1px 8px;cursor:pointer}
.row{display:flex;align-items:flex-end;padding:3px 0}.l{min-width:0;overflow-wrap:anywhere}
.dots{flex:1;min-width:14px;border-bottom:2px dotted var(--rule);margin:0 6px 5px}
.rt{margin-left:auto;text-align:right;overflow-wrap:anywhere;max-width:62%;font-variant-numeric:tabular-nums}
.rt a{color:var(--blue);text-decoration:none;font-weight:500}.rt a:hover{text-decoration:underline}.ext{font-weight:600}
mark{background:var(--hl);color:inherit;border-radius:2px}
.flash{animation:fl 1.6s}@keyframes fl{0%,60%{box-shadow:0 0 0 4px var(--amber)}100%{box-shadow:none}}
.empty{padding:60px 0;color:var(--mute)}
.addr{display:inline-flex;gap:5px;align-items:flex-start;text-align:left;font:inherit;border:0;background:none;padding:0;color:var(--blue);cursor:pointer}
.addr:hover span{text-decoration:underline}.addr svg{flex:none;width:14px;height:14px;margin-top:3px}
dialog{border:0;border-radius:12px;padding:0;width:min(94vw,860px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px #0008}
dialog::backdrop{background:#0a1020b0}
.mh{display:flex;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:3px solid var(--amber);background:var(--navy);color:var(--nink)}
.mh h3{margin:0;font:600 17px/1.3 "Source Serif 4",Georgia,serif}.mh p{margin:2px 0 0;font-size:13px;opacity:.85}
.mh button{align-self:flex-start;border:0;background:#ffffff1a;color:inherit;font-size:20px;line-height:1;border-radius:6px;padding:4px 10px;cursor:pointer}
dialog iframe{display:block;width:100%;height:min(58vh,460px);border:0;background:var(--side)}
.ma{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 18px}
.ma a,.ma button{font:inherit;font-size:13.5px;font-weight:500;padding:8px 14px;border-radius:7px;border:1px solid var(--rule);background:none;color:var(--ink);cursor:pointer;text-decoration:none}
.ma a.p{background:var(--navy);color:var(--nink);border-color:var(--navy)}
.ma small{flex-basis:100%;color:var(--mute);font-size:12px}
.org{display:flex;gap:8px;flex:1 1 280px}.org input{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--rule);border-radius:7px;background:var(--paper);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.on{opacity:1}
@media (max-width:960px){.shell{grid-template-columns:1fr}.tg{display:inline-block;border:1px solid #ffffff55;background:none;color:inherit;border-radius:6px;padding:7px 10px;font:inherit;font-size:13px}.cnt{display:none}.top{flex-wrap:wrap}.sw{order:3;flex-basis:100%;max-width:none}
.left,.right{position:fixed;top:0;bottom:0;width:min(86vw,320px);z-index:10;transition:transform .25s;padding-top:calc(env(safe-area-inset-top,0px) + 8px)}.left{left:0;transform:translateX(-105%)}.right{right:0;transform:translateX(105%)}.left.open,.right.open{transform:none}.main{padding:0 14px 60px}.grp{margin:0 -14px;padding:14px 14px 8px;font-size:21px}.rt{max-width:55%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style></head><body>
