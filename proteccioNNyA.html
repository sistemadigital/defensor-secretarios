<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Protección de NNyA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root{--b50:#eff6ff;--b100:#dbeafe;--b200:#bfdbfe;--b500:#3b82f6;--b600:#2563eb;--b700:#1d4ed8;--b900:#1e3a8a;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f5f8ff;--sh:0 1px 2px rgba(30,58,138,.05),0 6px 20px rgba(37,99,235,.06)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:14px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
h4{margin:2px 0 14px;font-size:14px;color:var(--b700)}h4 small{color:var(--mut);font-weight:500;margin-left:6px}
.sub{color:var(--mut);font-size:12px}.empty{padding:28px;text-align:center;color:var(--mut);margin:0}
:focus-visible{outline:2px solid var(--b500);outline-offset:2px}
/* barra superior */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top>div{max-width:1600px;margin:auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.01em}
.brand i{background:var(--b600);color:#fff;width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--b500);color:var(--b600)}.btn:disabled{opacity:.45;cursor:default}
.btn.p{background:var(--b600);border-color:var(--b600);color:#fff}.btn.p:hover{background:var(--b700);border-color:var(--b700);color:#fff}
main{max-width:1600px;margin:auto;padding:24px 20px 48px;display:grid;gap:22px}
/* disposición: tabla + panel lateral */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.side{position:sticky;top:84px;max-height:calc(100dvh - 108px);display:flex;flex-direction:column}
/* tarjetas, filtros */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.ch{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inp{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;width:100%;min-width:0;transition:.15s}
.inp:focus{outline:0;border-color:var(--b500);box-shadow:0 0 0 3px var(--b100)}textarea.inp{resize:vertical}
.srch{position:relative}.srch i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}.srch .inp{padding-left:35px;min-width:250px}
.tram{display:flex;flex-direction:column;gap:8px;padding:14px;overflow-y:auto;min-height:0}
.tr{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;background:#fff;transition:.15s}.tr:hover{border-color:var(--b500);background:var(--b50)}
.go{display:flex;align-items:center;gap:10px;flex:1;min-width:0;border:0;background:none;text-align:left;padding:10px 4px 10px 12px;cursor:pointer}
.go>span:last-child{min-width:0;flex:1}.go b,.go small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.go small{color:var(--mut);font-size:12px}
.fu{border:0;background:none;color:var(--mut);width:34px;height:34px;margin-right:6px;border-radius:9px;cursor:pointer;flex:none}.fu:hover{background:var(--b100);color:var(--b700)}
/* tabla */
.tw{overflow-x:auto;padding:2px 16px 6px;background:#f8fbff}
table{width:100%;border-collapse:separate;border-spacing:0 8px;min-width:720px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:6px 16px;white-space:nowrap}
td{padding:13px 16px;background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:middle;transition:.15s}
td:first-child{border-left:1px solid var(--line);border-radius:14px 0 0 14px;box-shadow:inset 3px 0 0 var(--st,var(--b500))}
td:last-child{border-right:1px solid var(--line);border-radius:0 14px 14px 0}
tbody tr:hover td{border-color:var(--b200);background:#fcfdff}
tr.proc{--st:#f59e0b}tr.cer{--st:#94a3b8}tr.hl td{background:var(--b100)!important}
.who{display:flex;align-items:center;gap:11px}.who b,.who small{display:block}.who small{color:var(--mut);font-size:12px;font-weight:400}
.av{width:36px;height:36px;border-radius:50%;background:var(--b100);color:var(--b700);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 11px;font-size:12px;font-weight:600;background:var(--b50);color:var(--b700);white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.proc{background:#fef3c7;color:#b45309}.pill.cer{background:#f1f5f9;color:#475569}
.tag{display:inline-block;background:var(--b50);color:var(--b700);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:500}
a.lnk{color:var(--b600);font-weight:600;text-decoration:none}a.lnk:hover{text-decoration:underline}
.acts{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:12px;background:#fff}
.acts button{width:32px;height:32px;border:0;border-radius:9px;background:none;color:var(--mut);cursor:pointer;font-size:15px;transition:.15s}
.acts button:hover{background:var(--b50);color:var(--b600)}.acts button[data-a=edit]:hover{background:var(--b600);color:#fff}
.pg{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px 20px;border-top:1px solid var(--line)}
.pgb{min-width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;font-weight:600;margin-left:4px;transition:.15s}
.pgb:hover:not(:disabled){border-color:var(--b500);color:var(--b600)}.pgb.on{background:var(--b600);border-color:var(--b600);color:#fff}.pgb:disabled{opacity:.4;cursor:default}
/* modales con solapas */
dialog{border:0;border-radius:20px;padding:0;width:min(980px,calc(100% - 24px));max-height:calc(100dvh - 24px);box-shadow:0 24px 80px rgba(15,23,42,.28);color:inherit;overflow:hidden}
dialog[open]{display:flex;flex-direction:column;animation:pop .22s ease}dialog::backdrop{background:rgba(15,23,42,.45);backdrop-filter:blur(3px)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
#dReg{width:min(1100px,calc(100% - 24px));height:min(820px,calc(100dvh - 24px))}#regBody .grid{grid-template-columns:repeat(3,1fr)}#dSeg,#dExp{width:min(720px,calc(100% - 24px))}
.mh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px}
.mh h3{margin:0;font-size:18px;font-weight:700;display:flex;gap:10px;align-items:center;letter-spacing:-.01em}.mh h3 i{color:var(--b600)}
.x{border:0;background:var(--b50);color:var(--b700);width:34px;height:34px;border-radius:50%;cursor:pointer;flex:none}.x:hover{background:var(--b100)}
.tabs{display:flex;gap:2px;padding:6px 14px 0;border-bottom:1px solid var(--line);background:#fafcff}
.tabs button{flex:1 1 0;min-width:0;border:0;background:none;padding:10px 4px 9px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s}
.tabs button i{font-size:17px}.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button:hover{color:var(--b600)}.tabs button.on{color:var(--b600);border-color:var(--b600)}
.mb{padding:22px;overflow-y:auto;flex:1;min-height:0}.pane{display:none}.pane.on{display:block}
.mf{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:14px 22px;border-top:1px solid var(--line);background:#fafcff;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.full{grid-column:1/-1}
.fld label{display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:6px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.chip{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:500;transition:.15s}
.chip:hover{border-color:var(--b200)}.chip:has(input:checked),.chip.on{background:var(--b50);border-color:var(--b500);color:var(--b700)}.chip.off{color:var(--mut);cursor:default}
.chip input{accent-color:var(--b600);width:16px;height:16px}
.info{display:flex;gap:8px;flex-wrap:wrap}
.bd{border-radius:99px;padding:3px 11px;font-size:12px;font-weight:600;background:#f1f5f9;color:#475569}
.bd.ok{background:#dcfce7;color:#166534}.bd.no{background:#fee2e2;color:#991b1b}.bd.warn{background:#fef3c7;color:#92400e}
.res{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(15,23,42,.14);max-height:210px;overflow-y:auto;z-index:10;display:none}
.res div{padding:9px 12px;cursor:pointer;border-bottom:1px solid #eef2f9}.res div:hover{background:var(--b50)}.res div:last-child{border:0}
.kv{display:grid;grid-template-columns:200px 1fr;margin:0 0 20px}.kv dt,.kv dd{margin:0;padding:9px 0;border-bottom:1px solid #eef2f9}.kv dt{color:var(--mut);font-weight:500;padding-right:12px}
.tl{display:grid;gap:14px;margin-bottom:16px}.ti{position:relative;border-left:2px solid var(--b200);padding:2px 34px 2px 14px}.ti small{display:block;color:var(--mut)}
.del{position:absolute;right:0;top:0;border:0;background:none;color:#ef4444;cursor:pointer;padding:4px}
.addseg{display:grid;gap:10px;justify-content:start;border-top:1px solid var(--line);padding-top:16px}.addseg .inp{width:min(560px,100%)}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-90px);background:var(--b900);color:#fff;padding:11px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(15,23,42,.25);z-index:1000;transition:.4s;max-width:min(420px,calc(100% - 24px));text-align:center;font-weight:500}
.toast.show{transform:translate(-50%,0)}.toast.err{background:#b91c1c}
@media(max-width:1500px){.h{display:none}}
@media(max-width:1250px){.h2{display:none}}
@media(max-width:1100px){.layout{grid-template-columns:1fr}.side{position:static;max-height:320px;order:-1}}
@media(max-width:900px){#regBody .grid{grid-template-columns:repeat(2,1fr)}.tabs button span{display:none}}
@media(max-width:700px){.grid,#regBody .grid,.kv{grid-template-columns:1fr}.kv dt{border:0;padding-bottom:0}.srch .inp{min-width:0}.srch,.tools>*{flex:1 1 100%}
dialog,#dReg,#dSeg,#dExp{width:100%;max-height:100dvh;height:100dvh!important;border-radius:0}.mh,.mb,.mf{padding-left:16px;padding-right:16px}.mf .tools{width:100%}.mf .tools .btn{flex:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="toast" id="toast" role="status"></div>
<header class="top"><div>
  <div class="brand"><i class="bi bi-shield-heart"></i>Protección de NNyA</div>
  <button class="btn p" data-a="new"><i class="bi bi-plus-lg"></i> Nuevo registro</button>
</div></header>

<main>
<div class="layout">
  <section class="card">
    <div class="ch"><h2>Casos registrados</h2>
      <div class="tools">
        <div class="srch"><i class="bi bi-search"></i><input id="q" class="inp" placeholder="Buscar por nombre o DNI" aria-label="Buscar"></div>
        <select id="est" class="inp" style="width:auto" aria-label="Estado"><option value="">Todos los estados</option><option>Abierto</option><option>En Proceso</option><option>Cerrado</option></select>
        <button class="btn" data-a="print"><i class="bi bi-printer"></i> Imprimir listado</button>
      </div>
    </div>
    <div class="tw" id="tabla"><p class="empty">Cargando casos…</p></div>
    <div class="pg"><span class="sub" id="pgi"></span><div id="pgn"></div></div>
  </section>

  <aside class="card side" aria-label="Casos en trámite">
    <div class="ch"><h2>Casos en trámite</h2><span class="tag" id="tramN">0</span></div>
    <div class="tram" id="tram"></div>
  </aside>
</div>
</main>

<!-- Registro -->
<dialog id="dReg">
  <div class="mh"><h3><i class="bi bi-person-plus"></i><span id="regT">Nuevo registro</span></h3><button class="x" data-close aria-label="Cerrar"><i class="bi bi-x-lg"></i></button></div>
  <div class="tabs" id="regTabs"></div>
  <div class="mb" id="regBody"></div>
  <div class="mf">
    <button class="btn" data-close>Cancelar</button>
    <div class="tools">
      <button class="btn" id="prev"><i class="bi bi-chevron-left"></i> Anterior</button>
      <button class="btn" id="next">Siguiente <i class="bi bi-chevron-right"></i></button>
      <button class="btn p" data-a="save"><i class="bi bi-check2-circle"></i> Guardar caso</button>
    </div>
  </div>
</dialog>

<!-- Ver caso -->
<dialog id="dVer">
  <div class="mh"><h3><i class="bi bi-eye"></i><span id="verT">Detalle del caso</span></h3><button class="x" data-close aria-label="Cerrar"><i class="bi bi-x-lg"></i></button></div>
  <div class="tabs" id="verTabs"></div>
  <div class="mb" id="verBody"></div>
  <div class="mf"><button class="btn" data-close>Cerrar</button><button class="btn" data-a="printVer"><i class="bi bi-printer"></i> Imprimir</button></div>
</dialog>

<!-- Seguimiento -->
<dialog id="dSeg">
  <div class="mh"><h3><i class="bi bi-journal-text"></i>Seguimiento del caso</h3><button class="x" data-close aria-label="Cerrar"><i class="bi bi-x-lg"></i></button></div>
  <div class="mb"><div id="tl"></div>
    <div class="addseg"><textarea id="nuevoSeg" class="inp" rows="3" placeholder="Escribí el nuevo seguimiento"></textarea><button class="btn p" data-a="addSeg"><i class="bi bi-plus-lg"></i> Agregar seguimiento</button></div>
  </div>
  <div class="mf"><button class="btn" data-close>Cerrar</button><button class="btn" data-a="printSeg"><i class="bi bi-printer"></i> Imprimir</button></div>
</dialog>

<!-- Expediente -->
<dialog id="dExp">
  <div class="mh"><h3><i class="bi bi-folder2-open"></i>Detalle del expediente</h3><button class="x" data-close aria-label="Cerrar"><i class="bi bi-x-lg"></i></button></div>
  <div class="mb" id="expBody"></div>
  <div class="mf"><button class="btn" data-close>Cerrar</button><button class="btn" data-a="printExp"><i class="bi bi-printer"></i> Imprimir</button></div>
</dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,push,get,child,update} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import {getFirestore,collection,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== Firebase (sin cambios) ===== */
// App 1: proteccion-personas (casos, Realtime Database)
const app1=initializeApp({apiKey:"AIzaSyAWlsFqN09y_DAAIKLLIjGjjyR2_rKJIFs",authDomain:"proteccion-personas.firebaseapp.com",projectId:"proteccion-personas"},"app1");
const rtdb=getDatabase(app1);
// App 2: causas-defensoria (expedientes HISTÓRICOS, Firestore)
const app2=initializeApp({apiKey:"AIzaSyBt6X0u0BpiNPcV2SNPrN-spCmjl2AhZaA",authDomain:"causas-defensoria.firebaseapp.com",databaseURL:"https://causas-defensoria-default-rtdb.firebaseio.com",projectId:"causas-defensoria"},"app2");
const db2=getFirestore(app2);
// App 3: causas-2defensoria (expedientes ACTIVOS, Firestore)
const app3=initializeApp({apiKey:"AIzaSyBevCwkh4iOWVqhp3gG2ae1eCUMkFpnr6I",authDomain:"causas-2defensoria.firebaseapp.com",projectId:"causas-2defensoria",storageBucket:"causas-2defensoria.firebasestorage.app",messagingSenderId:"663905632804",appId:"1:663905632804:web:4f686a88004dc642ad0eb1"},"app3");
const db3=getFirestore(app3);

/* ===== Utilidades ===== */
const $=id=>document.getElementById(id), $$=s=>[...document.querySelectorAll(s)];
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2=s=>e(s).replace(/\n/g,'<br>'), R=s=>({r:s}), nl=s=>R(nl2(s));
const fmtDT=d=>new Intl.DateTimeFormat('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d);
const fmtD=d=>new Intl.DateTimeFormat('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d);
const cap=s=>s[0].toUpperCase()+s.slice(1), ini=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function calcEdad(s){if(!s)return null;const d=new Date(s),t=new Date();let a=t.getFullYear()-d.getFullYear();const m=t.getMonth()-d.getMonth();if(m<0||(m===0&&t.getDate()<d.getDate()))a--;return a>=0?a:null}
let tt;function toast(m,k=''){const t=$('toast');t.textContent=m;t.className='toast show '+k;clearTimeout(tt);tt=setTimeout(()=>t.className='toast',3800)}
function imprimir(titulo,html){const w=window.open('','_blank');w.document.write(`<html><head><title>${e(titulo)}</title>${$$('style,link[rel=stylesheet]').map(n=>n.outerHTML).join('')}<style>body{background:#fff;padding:24px}.pane{display:block!important;margin-bottom:18px}.acts,.tabs{display:none}</style></head><body><h2 style="margin-bottom:16px">${e(titulo)}</h2>${html}</body></html>`);w.document.close();w.onload=()=>w.print()}

/* ===== Esquema del formulario: [id, etiqueta, tipo, extra]. Los ids son las claves guardadas en Firebase ===== */
const CH=(pre,items)=>({pre,items});
const TABS=[
 {i:'person',n:'NNA',t:'Datos del NNA',s:'Ley II - N.º 36',f:[
  ['nombreNNA','Nombre *'],['dniNNA','DNI'],['fechaNacimientoNNA','Fecha de nacimiento','date'],
  ['generoNNA','Género','sel',['Masculino','Femenino','Otro']],['centroVida','Centro de vida (localidad/prov.)'],
  ['vinculosFraternos','Vínculos fraternos preservados','sel',['Sí','No']],
  ['situacionVulneracion','Situación','area'],[null,null,'badge',[['edadNNAInfo','Edad NNA: —']]]]},
 {i:'house',n:'Acogimiento',t:'Medida y acogimiento',s:'Ley II - N.º 36',f:[
  ['tipoMedida','Tipo de medida excepcional','sel',['Administrativa con intervención judicial','Judicial']],
  ['autoridadInterviniente','Autoridad interviniente','text','Órgano/juzgado/área'],
  ['fechaMedida','Fecha de la medida','date'],['fechaIngresoSAF','Fecha de ingreso al SAF','date'],
  ['tipoFamilia','Tipo de familia de acogimiento','sel',['Alternativa','Inmediata (≤ 10 días)']],['rufAAFA','RUFAAFA (N° de registro)'],
  ['faNombre','Referente de familia de acogimiento','text','Nombre y apellido'],['faDni','DNI del referente','text','Documento'],
  ['faFechaNac','Fecha de nacimiento del referente','date'],['faContacto','Contacto (tel/correo)'],
  ['faDomicilio','Domicilio de la familia de acogimiento'],['faResidenciaAnos','Años de residencia en Misiones','number','Ej: 3'],
  [null,null,'badge',[['edadFAInfo','Edad referente: —'],['difEdadInfo','Diferencia con NNA: —'],['residenciaInfo','Residencia: —']]],
  ['etapas','Etapa del proceso (Art. 14)','chips',CH('etapa',[['convocatoria','Convocatoria'],['evaluacion','Evaluación y selección'],['capacitacion','Capacitación'],['inscripcion','Inscripción RUFAAFA'],['plan','Plan de intervención']])],
  ['planIntervencion','Plan de intervención','area','Objetivos, acciones, roles (Art. 14.5)'],
  ['causalEgreso','Egreso (si aplica)','sel',['Revinculación con familia de origen','Vinculación con familia extensa','Adoptabilidad y guarda con fines de adopción','Mayoría de edad']],
  ['fechaEgreso','Fecha de egreso','date'],
  ['obsDerechos','Observaciones sobre derecho a ser oído / identidad / integridad','area','Registro de escucha activa, identidad y resguardo (Art. 4)']]},
 {i:'info-circle',n:'Adicional',t:'Información adicional',s:'Ley II - N.º 16',f:[
  ['nombreCompletoNNA','Nombre completo del NNA'],['nacionalidadNNA','Nacionalidad'],['identidadCulturalNNA','Identidad cultural / Idioma de origen'],
  ['opinionNNA','Opinión del NNA','area','Registrar la opinión y deseos del menor sobre el caso.']]},

  if(t==='chips')return `<div class="fld full"><label>${l}</label><div class="chips">${x.items.map(([k,tx])=>`<label class="chip"><input type="checkbox" id="${cid(x,k)}"> ${tx}</label>`).join('')}</div></div>`;

function setTab(d,i){

/* ===== Estado ===== */
/* Bases de expedientes: activa (causas-2defensoria) e histórica (causas-defensoria) */
const BASES={activa:'Activa',historica:'Histórica'};
const DB_EXP={activa:db3,historica:db2};
const causasIndex={activa:{},historica:{}},expCargada={activa:false,historica:false};
/* Base de un expediente: la guardada en el caso o, en casos antiguos (sin base), la que lo contenga */
const baseDe=(n,b)=>BASES[b]?b:(causasIndex.historica[n]?'historica':(causasIndex.activa[n]?'activa':''));
let casos=[],filtrados=[],editandoId=null,lastId=null,casoSeg=null,pagina=1;const PAGE=8;
const getExp=(n,b)=>{const c=causasIndex[baseDe(n,b)]?.[n];return c?(c.caratula||c.numCausa||''):(n||'')};

/* ===== Formulario: leer / llenar / limpiar ===== */
function readForm(){
  const d={};
  FLAT.forEach(([id])=>{if(id!=='seguimientoInicial')d[id]=$(id).value});
  if(!d.expedienteReferencia)d.expedienteBase='';
  GROUPS.forEach(([g,,,x])=>{d[g]={};x.items.forEach(([k])=>d[g][k]=$(cid(x,k)).checked)});
  return d;
}
function fill(c){
  FLAT.forEach(([id])=>{if(c[id]!=null)$(id).value=c[id]});
  $('expedienteBase').value=baseDe(c.expedienteReferencia,c.expedienteBase)||'activa';
  GROUPS.forEach(([g,,,x])=>x.items.forEach(([k])=>$(cid(x,k)).checked=!!c[g]?.[k]));
  badges();
}
function limpiar(){
  FLAT.forEach(([id])=>$(id).value='');$('estadoCaso').value='Abierto';$('expedienteBase').value='activa';
  $$('#regBody input[type=checkbox]').forEach(c=>c.checked=false);
  editandoId=null;$('seguimientoInicial').closest('.fld').hidden=false;$('expRes').style.display='none';
  badges();setTab($('dReg'),0);
}
const bd=(id,t,l='')=>{const x=$(id);x.textContent=t;x.className='bd '+l};
function badges(auto){
  const n=calcEdad($('fechaNacimientoNNA').value),f=calcEdad($('faFechaNac').value),y=parseInt($('faResidenciaAnos').value,10),df=n!=null&&f!=null?f-n:null;
  bd('edadNNAInfo','Edad NNA: '+(n!=null?n+' años':'—'),n!=null?'ok':'');
  bd('edadFAInfo','Edad referente: '+(f!=null?f+' años':'—'),f==null?'':f>=25?'ok':'no');
  bd('difEdadInfo','Diferencia con NNA: '+(df!=null?df+' años':'—'),df==null?'':df>=15?'ok':'no');
  bd('residenciaInfo','Residencia: '+(isNaN(y)?'—':y+' años'),isNaN(y)?'':y>=2?'ok':'warn');
  if(auto){ // tilda los requisitos que se deducen de las fechas
    if(f!=null)$('reqEdad').checked=f>=25;

function filtrarExp(q){
  const r=$('expRes');r.innerHTML='';
  if(!q){r.style.display='none';return}
  const b=$('expedienteBase').value||'activa',ix=causasIndex[b];
  const l=Object.keys(ix).filter(n=>`causa ${n} ${ix[n].caratula||''}`.toLowerCase().includes(q.toLowerCase()));
  r.innerHTML=l.length?l.map(n=>`<div data-n="${e(n)}">Causa ${e(n)}${ix[n].caratula?' – '+e(ix[n].caratula):''}</div>`).join(''):`<div>${expCargada[b]?'No se encontraron expedientes':'Cargando expedientes de la base '+BASES[b].toLowerCase()+'…'}</div>`;
  r.style.display='block';

/* ===== Guardar (RTDB app1:/casos) ===== */
async function guardar(){
  const d=readForm();
  if(!d.nombreNNA.trim()){toast('Completá el nombre del NNA.','err');setTab($('dReg'),0);return}
  if(!d.nombreCompletoNNA.trim())d.nombreCompletoNNA=d.nombreNNA;
  const n=calcEdad(d.fechaNacimientoNNA),f=calcEdad(d.faFechaNac),y=parseInt(d.faResidenciaAnos,10);
  const err=(m)=>{toast(m,'err');setTab($('dReg'),1)};
  if(f!=null&&f<25)return err('El referente debe tener 25 años o más (Art. 18).');
  if(n!=null&&f!=null&&f-n<15)return err('La diferencia de edad con el NNA debe ser de 15 años o más (Art. 18).');
  if(!isNaN(y)&&y<2)return err('La residencia en Misiones debe ser de 2 años o más (Art. 18).');
  const now=fmtDT(new Date());
  try{
    if(editandoId){
      const r=ref(rtdb,'casos/'+editandoId),s=await get(r),h=s.val()?.historial||[];
      h.push({fecha:now,accion:'Edición del caso'});
      await update(r,{...d,historial:h});lastId=editandoId;
    }else{
      const ini=$('seguimientoInicial').value.trim();
      const res=await push(ref(rtdb,'casos'),{...d,fechaRegistro:fmtD(new Date()),seguimientos:ini?[{fecha:now,texto:ini}]:[],historial:[{fecha:now,accion:'Creación del caso'}]});
      lastId=res.key;
    }
    $('dReg').close();toast('Caso guardado.');await cargarCasos();
  }catch(x){console.error(x);toast('No se pudo guardar: '+x.message,'err')}
}

/* ===== Carga de datos ===== */
async function cargarBase(b){
  causasIndex[b]={};
  try{(await getDocs(collection(DB_EXP[b],'causas'))).forEach(d=>{const v=d.data();if(v?.numCausa)causasIndex[b][v.numCausa]={...v,firebaseId:d.id}});expCargada[b]=true}
  catch(x){console.error('Error al cargar expedientes ('+b+'):',x);toast('No se pudo cargar la base de expedientes '+BASES[b].toLowerCase()+'.','err')}
}
const cargarExpedientes=()=>Promise.all(Object.keys(BASES).map(cargarBase));
async function cargarCasos(){
  try{const s=await get(child(ref(rtdb),'casos'));casos=s.exists()?Object.entries(s.val()).map(([id,v])=>({id,...v})).reverse():[]}
  catch(x){casos=[];console.error(x);toast('No se pudieron cargar los casos.','err')}
  filtrar();tramite();
}

     <td class="h">${e(c.fechaRegistro||'—')}<div class="sub">${s} seguimiento${s===1?'':'s'}</div></td>

  const pb=(p,l,x='',dis=false)=>`<button class="pgb ${x}" data-a="pg" data-p="${p}" ${dis?'disabled':''}>${l}</button>`;
  let i0=Math.max(1,pagina-2),i1=Math.min(P,i0+4);i0=Math.max(1,i1-4);

  $('expBody').innerHTML=`<h4>Datos del expediente</h4>`+kv([['Número de causa',c.numCausa],['Base de expedientes',BASES[bs]],['Carátula',c.caratula],['Fecha de registro',c.fecha],['Estado',c.estado],['Detalle',nl(c.detalle)]])+`<h4>Seguimientos</h4>`+(s.length?tl(s):'<p class="empty">Sin seguimientos registrados.</p>');

}

  catch(x){console.error(x);toast('No se pudo guardar el seguimiento.','err')}
}

/* ===== Acciones (delegación de eventos) ===== */
const ACT={
  new:()=>{limpiar();$('regT').textContent='Nuevo registro';$('dReg').showModal()},
  edit:({id})=>{const c=casos.find(x=>x.id===id);if(!c)return;limpiar();fill(c);editandoId=id;$('seguimientoInicial').closest('.fld').hidden=true;$('regT').textContent='Editar registro';$('dReg').showModal()},
  view:verCaso,seg:abrirSeg,exp:verExp,save:guardar,
  pg:({p})=>{pagina=+p;tabla()},
  addSeg:async()=>{const t=$('nuevoSeg').value.trim();if(!t)return;await saveSeg([...segArr(),{fecha:fmtDT(new Date()),texto:t}]);$('nuevoSeg').value=''},
  delSeg:async({i})=>{if(confirm('¿Eliminar este seguimiento?'))await saveSeg(segArr().filter((_,k)=>k!==+i))},
  print:()=>imprimir('Listado de casos registrados',$('tabla').innerHTML),
  printVer:()=>imprimir($('verT').textContent,$('verBody').innerHTML),
  printSeg:()=>imprimir('Seguimiento del caso',$('tl').innerHTML),
  printExp:()=>imprimir('Detalle del expediente',$('expBody').innerHTML)
};
document.addEventListener('click',ev=>{
  const t=ev.target;
  if(!t.closest('#expRes')&&t.id!=='expedienteReferencia')$('expRes').style.display='none';
  if(t.closest('[data-close]'))return t.closest('dialog').close();
  const tb=t.closest('.tabs button');if(tb)return setTab(tb.closest('dialog'),[...tb.parentNode.children].indexOf(tb));
  const ex=t.closest('#expRes div[data-n]');if(ex){$('expedienteReferencia').value=ex.dataset.n;$('expRes').style.display='none';return}
  if(t.tagName==='DIALOG'&&t.id!=='dReg')return t.close();
  const b=t.closest('[data-a]');if(!b)return;ev.preventDefault();ACT[b.dataset.a]?.(b.dataset);
});
$('regBody').addEventListener('input',ev=>{
  if(['fechaNacimientoNNA','faFechaNac','faResidenciaAnos'].includes(ev.target.id))badges(true);
  if(ev.target.id==='expedienteBase'){$('expedienteReferencia').value='';$('expRes').style.display='none'}
  if(ev.target.id==='expedienteReferencia')filtrarExp(ev.target.value);
});
$('prev').onclick=()=>setTab($('dReg'),+$('dReg').dataset.tab-1);
$('next').onclick=()=>setTab($('dReg'),+$('dReg').dataset.tab+1);
$('q').oninput=filtrar;$('est').onchange=filtrar;

/* ===== Inicio ===== */
buildForm();limpiar();
await Promise.all([cargarExpedientes(),cargarCasos()]);
tabla();tramite(); // vuelve a pintar con las carátulas de expedientes ya cargadas
</script>
</body>
</html>
