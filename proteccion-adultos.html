<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Protección de Personas Adultas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<!-- Firebase (sin cambios) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
:root{--b50:#eff6ff;--b100:#dbeafe;--b200:#bfdbfe;--b500:#3b82f6;--b600:#2563eb;--b700:#1d4ed8;--b900:#1e3a8a;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f5f8ff;--sh:0 1px 2px rgba(30,58,138,.05),0 6px 20px rgba(37,99,235,.06)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:14px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
h4{margin:2px 0 14px;font-size:14px;color:var(--b700)}
.sub{color:var(--mut);font-size:12px}.empty{padding:28px;text-align:center;color:var(--mut);margin:0}
:focus-visible{outline:2px solid var(--b500);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top>div{max-width:1600px;margin:auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.01em}
.brand i{background:var(--b600);color:#fff;width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--b500);color:var(--b600)}.btn:disabled{opacity:.5;cursor:default}
.btn.p{background:var(--b600);border-color:var(--b600);color:#fff}.btn.p:hover:not(:disabled){background:var(--b700);border-color:var(--b700);color:#fff}
main{max-width:1600px;margin:auto;padding:24px 20px 48px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.side{position:sticky;top:84px;max-height:calc(100dvh - 108px);display:flex;flex-direction:column}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.ch{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inp{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;width:100%;min-width:0;transition:.15s}
.inp:focus{outline:0;border-color:var(--b500);box-shadow:0 0 0 3px var(--b100)}textarea.inp{resize:vertical}
.srch{position:relative}.srch i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}.srch .inp{padding-left:35px;min-width:240px}
.tram{display:flex;flex-direction:column;gap:8px;padding:14px;overflow-y:auto;min-height:0}
.tr{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;background:#fff;transition:.15s}.tr:hover{border-color:var(--b500);background:var(--b50)}
.go{display:flex;align-items:center;gap:10px;flex:1;min-width:0;border:0;background:none;text-align:left;padding:10px 4px 10px 12px;cursor:pointer}
.go>span:last-child{min-width:0;flex:1}.go b,.go small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.go small{color:var(--mut);font-size:12px}
.fu{border:0;background:none;color:var(--mut);width:34px;height:34px;margin-right:6px;border-radius:9px;cursor:pointer;flex:none}.fu:hover{background:var(--b100);color:var(--b700)}
.tw{overflow-x:auto;padding:2px 16px 6px;background:#f8fbff}
table{width:100%;border-collapse:separate;border-spacing:0 8px;min-width:720px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:6px 16px;white-space:nowrap}
td{padding:13px 16px;background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:middle;transition:.15s}
td:first-child{border-left:1px solid var(--line);border-radius:14px 0 0 14px;box-shadow:inset 3px 0 0 var(--st,var(--b500))}
td:last-child{border-right:1px solid var(--line);border-radius:0 14px 14px 0}
tbody tr:hover td{border-color:var(--b200);background:#fcfdff}
tr.proc{--st:#f59e0b}tr.cer{--st:#94a3b8}tr.hl td{background:var(--b100)!important}
.who{display:flex;align-items:center;gap:11px}.who b,.who small{display:block}.who small{color:var(--mut);font-size:12px;font-weight:400}
.av{width:36px;height:36px;border-radius:50%;background:var(--b100);color:var(--b700);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 11px;font-size:12px;font-weight:600;background:var(--b50);color:var(--b700);white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.proc{background:#fef3c7;color:#b45309}.pill.cer{background:#f1f5f9;color:#475569}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--b50);color:var(--b700);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.acts{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:12px;background:#fff}
.acts button{width:32px;height:32px;border:0;border-radius:9px;background:none;color:var(--mut);cursor:pointer;font-size:15px;transition:.15s}
.acts button:hover{background:var(--b50);color:var(--b600)}.acts button[data-a=edit]:hover{background:var(--b600);color:#fff}
.pg{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px 20px;border-top:1px solid var(--line)}
.pgb{min-width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;font-weight:600;margin-left:4px;transition:.15s}
.pgb:hover:not(:disabled){border-color:var(--b500);color:var(--b600)}.pgb.on{background:var(--b600);border-color:var(--b600);color:#fff}.pgb:disabled{opacity:.4;cursor:default}
/* modales */
dialog{border:0;border-radius:20px;padding:0;width:min(980px,calc(100% - 24px));max-height:calc(100dvh - 24px);box-shadow:0 24px 80px rgba(15,23,42,.28);color:inherit;overflow:hidden}
dialog[open]{display:flex;flex-direction:column;animation:pop .22s ease}dialog::backdrop{background:rgba(15,23,42,.45);backdrop-filter:blur(3px)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
#dReg{width:min(920px,calc(100% - 24px))}#dSeg{width:min(720px,calc(100% - 24px))}
.mh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px}
.mh h3{margin:0;font-size:18px;font-weight:700;display:flex;gap:10px;align-items:center;letter-spacing:-.01em}.mh h3 i{color:var(--b600)}
.x{border:0;background:var(--b50);color:var(--b700);width:34px;height:34px;border-radius:50%;cursor:pointer;flex:none}.x:hover{background:var(--b100)}
.tabs{display:flex;gap:2px;padding:6px 14px 0;border-bottom:1px solid var(--line);background:#fafcff}
.tabs button{flex:1 1 0;min-width:0;border:0;background:none;padding:10px 4px 9px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s}
.tabs button i{font-size:17px}.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button:hover:not(:disabled){color:var(--b600)}.tabs button.on{color:var(--b600);border-color:var(--b600)}.tabs button:disabled{opacity:.4;cursor:default}
.tabs .sm{display:none}
.mb{padding:20px 22px;overflow-y:auto;flex:1;min-height:0}.pane{display:none}.pane.on{display:block}
.mf{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:14px 22px;border-top:1px solid var(--line);background:#fafcff;flex-wrap:wrap}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.s1{grid-column:span 1}.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}
.fld label{display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:6px}
.rel{position:relative}
.res{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(15,23,42,.14);max-height:210px;overflow-y:auto;z-index:10;display:none}
.res div{padding:9px 12px;cursor:pointer;border-bottom:1px solid #eef2f9}.res div:hover{background:var(--b50)}.res div:last-child{border:0}
details.ref{background:var(--b50);border-radius:12px;padding:9px 14px;margin-bottom:16px;color:var(--b900)}
details.ref summary{cursor:pointer;font-weight:600}details.ref p{margin:8px 0 2px;font-size:12.5px;line-height:1.6}
.kv{display:grid;grid-template-columns:200px 1fr;margin:0 0 20px}.kv dt,.kv dd{margin:0;padding:9px 0;border-bottom:1px solid #eef2f9}.kv dt{color:var(--mut);font-weight:500;padding-right:12px}
.tl{display:grid;gap:14px;margin-bottom:16px}.ti{position:relative;border-left:2px solid var(--b200);padding:2px 34px 2px 14px}.ti small{display:block;color:var(--mut)}
.del{position:absolute;right:0;top:0;border:0;background:none;color:#ef4444;cursor:pointer;padding:4px}
.addseg{display:grid;gap:10px;justify-content:start;border-top:1px solid var(--line);padding-top:16px}.addseg .inp{width:min(560px,100%)}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-90px);background:var(--b900);color:#fff;padding:11px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(15,23,42,.25);z-index:1000;transition:.4s;max-width:min(420px,calc(100% - 24px));text-align:center;font-weight:500}
.toast.show{transform:translate(-50%,0)}.toast.err{background:#b91c1c}
@media(max-width:1500px){.h{display:none}}
@media(max-width:1250px){.h2{display:none}}
@media(max-width:1100px){.layout{grid-template-columns:1fr}.side{position:static;max-height:320px;order:-1}}
@media(max-width:900px){.g6{grid-template-columns:repeat(2,1fr)}.g6>*{grid-column:auto}.g6>.s6,.g6>.s4{grid-column:1/-1}}
@media(max-width:700px){.g6{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.kv dt{border:0;padding-bottom:0}.srch .inp{min-width:0}.srch,.tools>*{flex:1 1 100%}
.tabs .lg{display:none}.tabs .sm{display:inline}
dialog,#dReg,#dSeg{width:100%;max-height:100dvh;height:100dvh;border-radius:0}.mh,.mb,.mf{padding-left:16px;padding-right:16px}.mf .tools{width:100%}.mf .tools .btn{flex:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="toast" id="toast" role="status"></div>
<header class="top"><div>
  <div class="brand"><i class="bi bi-shield-check"></i>Protección de Personas Adultas</div>
  <button class="btn p" data-a="new"><i class="bi bi-plus-lg"></i> Nuevo registro</button>
</div></header>

<main><div class="layout">
  <section class="card">
    <div class="ch"><h2>Casos registrados</h2>
      <div class="tools">
        <div class="srch"><i class="bi bi-search"></i><input id="q" class="inp" placeholder="Buscar por nombre, DNI o tipo" aria-label="Buscar"></div>
        <select id="ftipo" class="inp" style="width:auto" aria-label="Tipo de caso"></select>
        <select id="fest" class="inp" style="width:auto" aria-label="Estado"><option value="">Todos los estados</option><option>Abierto</option><option>En Proceso</option><option>Cerrado</option></select>
        <button class="btn" data-a="print"><i class="bi bi-printer"></i> Imprimir listado</button>
      </div>
    </div>
    <div class="tw" id="tabla"><p class="empty">Cargando casos…</p></div>
    <div class="pg"><span class="sub" id="pgi"></span><div id="pgn"></div></div>
  </section>

  <aside class="card side" aria-label="Casos en trámite">
    <div class="ch"><h2>Casos en trámite</h2><span class="tag" id="tramN">0</span></div>
    <div class="tram" id="tram"></div>
  </aside>
</div></main>

<!-- Registro: una solapa por tipo de caso -->
<dialog id="dReg">
  <div class="mh"><h3><i class="bi bi-person-plus"></i><span id="regT">Nuevo registro</span></h3><button class="x" data-close aria-label="Cerrar"><i class="bi bi-x-lg"></i></button></div>
  <div class="tabs" id="regTabs"></div>
  <div class="mb">
    <details class="ref"><summary>Referencia legal</summary><p id="refTxt"></p></details>
    <form id="fReg" class="g6" onsubmit="return false">
      <div class="fld s3"><label for="fNom" id="lNom"></label><input class="inp" id="fNom" required></div>
      <div class="fld s2"><label for="fDni">DNI *</label><input class="inp" id="fDni" required></div>
      <div class="fld s1"><label for="fEdad">Edad *</label><input class="inp" id="fEdad" type="number" min="1" required></div>
      <div class="fld s2"><label for="fTel">Teléfono</label><input class="inp" id="fTel" type="tel"></div>
      <div class="fld s2" id="wDir"><label for="fDir">Dirección</label><input class="inp" id="fDir"></div>
      <div class="fld s2" id="wExp"><label for="fExpS">Expediente de referencia</label>
        <div class="rel"><input class="inp" id="fExpS" autocomplete="off" placeholder="Buscar expediente"><input type="hidden" id="fExp"><div class="res" id="lstExp"></div></div>
        <small class="sub" id="expInfo"></small></div>
      <div class="fld s6"><label for="fDesc" id="lDesc"></label><textarea class="inp" id="fDesc" rows="2" required></textarea></div>
      <div class="fld s2"><label for="fOrg">Organismo interviniente *</label><select class="inp" id="fOrg" required></select></div>
      <div class="fld s2"><label for="fInt">Intervención de la Defensoría *</label><select class="inp" id="fInt" required></select></div>
      <div class="fld s2"><label for="fEstado">Estado</label><select class="inp" id="fEstado"><option>Abierto</option><option>En Proceso</option><option>Cerrado</option></select></div>
      <div class="fld s3" id="wNOrg" hidden><label for="fNOrg">Nombre del nuevo organismo *</label><input class="inp" id="fNOrg"></div>
      <div class="fld s3" id="wNCon" hidden><label for="fNCon">Contacto (email/teléfono)</label><input class="inp" id="fNCon"></div>
    </form>
  </div>
  <div class="mf">
    <button class="btn" data-close>Cancelar</button>
    <div class="tools">
      <button class="btn" data-a="printReg"><i class="bi bi-printer"></i> Imprimir</button>
      <button class="btn p" id="btnSave" data-a="save"><i class="bi bi-check2-circle"></i> <span id="saveT">Guardar registro</span></button>
    </div>
  </div>
</dialog>

<!-- Ver registro -->
<dialog id="dVer">
  <div class="mh"><h3><i class="bi bi-eye"></i><span id="verT">Detalle del registro</span></h3><button class="x" data-close aria-label="Cerrar"><i class="bi bi-x-lg"></i></button></div>
  <div class="tabs" id="verTabs"></div>
  <div class="mb" id="verBody"></div>
  <div class="mf"><button class="btn" data-close>Cerrar</button><button class="btn" data-a="printVer"><i class="bi bi-printer"></i> Imprimir</button></div>
</dialog>

<!-- Seguimiento -->
<dialog id="dSeg">
  <div class="mh"><h3><i class="bi bi-journal-text"></i>Seguimiento del caso</h3><button class="x" data-close aria-label="Cerrar"><i class="bi bi-x-lg"></i></button></div>
  <div class="mb"><div id="tl"></div>
    <div class="addseg"><textarea id="nuevoSeg" class="inp" rows="3" placeholder="Escribí el nuevo seguimiento"></textarea><button class="btn p" data-a="addSeg"><i class="bi bi-plus-lg"></i> Agregar seguimiento</button></div>
  </div>
  <div class="mf"><button class="btn" data-close>Cerrar</button><button class="btn" data-a="printSeg"><i class="bi bi-printer"></i> Imprimir</button></div>
</dialog>

<script>
'use strict';
/* ===== Firebase (sin cambios) ===== */
firebase.initializeApp({
  apiKey:"AIzaSyDEo_AZS9Sx-YwePNNqGwLvsWR9X1nlL5A",authDomain:"proteccion-unificada.firebaseapp.com",
  databaseURL:"https://proteccion-unificada-default-rtdb.firebaseio.com",projectId:"proteccion-unificada",
  storageBucket:"proteccion-unificada.firebasestorage.app",messagingSenderId:"536876739483",appId:"1:536876739483:web:6ce9044af245cc116a4f3e"});
const rtdb=firebase.database();                       // registros (Realtime Database)
const app2=firebase.initializeApp({apiKey:"AIzaSyBt6X0u0BpiNPcV2SNPrN-spCmjl2AhZaA",authDomain:"causas-defensoria.firebaseapp.com",databaseURL:"https://causas-defensoria-default-rtdb.firebaseio.com",projectId:"causas-defensoria"},"app2");
const db2=app2.firestore();                           // expedientes (Firestore: causas)

/* ===== Utilidades ===== */
const $=id=>document.getElementById(id), $$=s=>[...document.querySelectorAll(s)], V=id=>$(id).value.trim();
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2=s=>e(s).replace(/\n/g,'<br>'), R=s=>({r:s}), nl=s=>R(nl2(s));
const ini=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const p2=n=>String(n).padStart(2,'0');
function fmtF(f,h){if(!f)return '';const d=new Date(f);if(isNaN(d))return '';return `${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}`+(h?` ${p2(d.getHours())}:${p2(d.getMinutes())}`:'')}
let tt;function toast(m,k=''){const t=$('toast');t.textContent=m;t.className='toast show '+k;clearTimeout(tt);tt=setTimeout(()=>t.className='toast',3800)}
function imprimir(titulo,html){const w=window.open('','_blank');w.document.write(`<html><head><title>${e(titulo)}</title>${$$('style,link[rel=stylesheet]').map(n=>n.outerHTML).join('')}<style>body{background:#fff;padding:24px}.pane{display:block!important;margin-bottom:18px}.acts,.tabs{display:none}</style></head><body><h2 style="margin-bottom:16px">${e(titulo)}</h2>${html}</body></html>`);w.document.close();w.onload=()=>w.print()}
const kv=rows=>`<dl class="kv">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v?.r??(e(v)||'<span class="sub">—</span>')}</dd>`).join('')}</dl>`;
const tl=(a,del)=>`<div class="tl">${a.map((x,i)=>`<div class="ti"><small>${e(x.fecha)}</small><div>${nl2(x.texto)}</div>${del?`<button class="del" data-a="delSeg" data-i="${i}" title="Eliminar" aria-label="Eliminar"><i class="bi bi-trash3"></i></button>`:''}</div>`).join('')}</div>`;

/* ===== Catálogos ===== */
const TIPOS={
 proteccion:{n:'Protección Adulto Mayor',s:'Adulto mayor',i:'person-heart',nom:'Nombre del adulto mayor',desc:'Situación de vulnerabilidad',dir:true,
  ref:'Ley Provincial XVI - N° 114 (Antes Ley 4532) - Protección Integral de las Personas Adultas Mayores. Ley Nacional 27.360 - Aprobación de la Convención Interamericana sobre la Protección de los Derechos Humanos de las Personas Mayores.'},
 capacidad:{n:'Determinación de Capacidad',s:'Capacidad',i:'clipboard2-pulse',nom:'Nombre de la persona',desc:'Motivo de evaluación',
  ref:'Código Civil y Comercial de la Nación, Arts. 31 a 42. Ley Nacional 26.657 - Derecho a la Protección de la Salud Mental. Ley Provincial XVI - N° 26 (Antes Ley 4241) - Adhesión a la Ley Nacional de Salud Mental.'},
 restriccion:{n:'Restricción de Capacidad',s:'Restricción',i:'person-lock',nom:'Nombre de la persona',desc:'Fundamentos de la restricción',
  ref:'Código Civil y Comercial de la Nación, Arts. 32, 43 a 61. Proceso de restricción de capacidad e incapacidad con intervención del Ministerio Público. Se debe priorizar sistemas de apoyo que preserven la autonomía de la persona.'},
 internacion:{n:'Internación Involuntaria',s:'Internación',i:'hospital',nom:'Nombre del paciente',desc:'Diagnóstico y justificación',
  ref:'Art. 42. Ley Nacional 26.657 - Arts. 20, 21 y 22 sobre Internación Involuntaria. Control judicial obligatorio en un plazo máximo de 5 días. Requisitos: Peligro cierto e inminente para sí o para terceros, y que otras alternativas terapéuticas hayan resultado insuficientes.'}
};
const DEF_ORG=[
 {nombre:"Hospital Barreyro",email:"hospitaldepediatriabarreyro@gmail.com",tipo:"Hospital de Pediatría"},
 {nombre:"Hospital Carrillo",email:"hospitalsaludmentalcarrillo@gmail.com",tipo:"Hospital de Salud Mental"},
 {nombre:"Ministerio de Salud Pública de Misiones",email:"juridicomspmisiones@gmail.com",tipo:"Oficios dirigidos a cualquier Hospital",contacto:"Jordana Duarte Martinelli - +5493755636878"},
 {nombre:"Unidad Central de Traslado",email:"mps-uct@hotmail.com",tipo:"Servicios de traslado médico"},
 {nombre:"Dirección de Asuntos de Familia",telefono:"+5493764856048",tipo:"Atención en asuntos familiares"},
 {nombre:"Fundación Reto a la Vida",email:"retomisiones@gmail.com",tipo:"Fundación de apoyo social"}];
const INTERV=['Patrocinante Actora','Patrocinante Demandada','Patrocinante presunto incapaz','Ministerio Público del incapaz','Asistencia Letrada del Incapaz'];
const tipoDe=n=>Object.keys(TIPOS).find(k=>TIPOS[k].n===n);
const ST={'Abierto':'','En Proceso':'proc','Cerrado':'cer'};
const pill=s=>`<span class="pill ${ST[s]??''}">${e(s||'Abierto')}</span>`;

/* ===== Estado ===== */
let organismos=[...DEF_ORG],registros=[],filtrados=[],expedientes={},tipo='proteccion',editId=null,lastId=null,casoSeg=null,verActual=null,pagina=1;const PAGE=8;

/* ===== Formulario de registro ===== */
function setTipo(k){
  tipo=k;const t=TIPOS[k];
  $$('#regTabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  $('regT').textContent=editId?'Editar registro':'Nuevo registro';
  $('lNom').textContent=t.nom+' *';$('lDesc').textContent=t.desc+' *';$('refTxt').textContent=t.ref;
  $('wDir').hidden=!t.dir;$('wExp').className='fld '+(t.dir?'s2':'s4');
  $('saveT').textContent=editId?'Actualizar registro':'Guardar registro';
}
function fillOrgs(){
  $('fOrg').innerHTML='<option value="">Seleccionar organismo…</option>'+organismos.map((o,i)=>`<option value="${i}">${e(o.nombre)}</option>`).join('')+'<option value="otro">Otro (agregar nuevo organismo)</option>';
}
function orgChange(){const o=$('fOrg').value==='otro';$('wNOrg').hidden=$('wNCon').hidden=!o;$('fNOrg').required=o}
function limpiar(){
  $('fReg').reset();editId=null;$('lstExp').style.display='none';$('expInfo').textContent='';
  orgChange();$$('#regTabs button').forEach(b=>b.disabled=false);
}
function listaExp(q){
  const ql=(q||'').toLowerCase(),l=$('lstExp');
  const k=Object.keys(expedientes).filter(n=>!ql||n.toLowerCase().includes(ql)||(expedientes[n].caratula||'').toLowerCase().includes(ql)).slice(0,50);
  l.innerHTML=k.length?k.map(n=>`<div data-n="${e(n)}">${e(n)} - ${e(expedientes[n].caratula||'Sin carátula')}</div>`).join(''):'<div>No se encontraron expedientes</div>';
  l.style.display='block';
}
function datosForm(){
  let on='',oc='';
  if($('fOrg').value==='otro'){on=V('fNOrg');oc=V('fNCon')}
  else{const o=organismos[$('fOrg').value];if(o){on=o.nombre||'';oc=o.email||o.telefono||o.contacto||''}}
  return {tipo:TIPOS[tipo].n,nombre:V('fNom'),dni:V('fDni'),edad:V('fEdad'),telefono:V('fTel'),direccion:TIPOS[tipo].dir?V('fDir'):'',
    expedienteReferencia:$('fExp').value,descripcion:V('fDesc'),intervencion:$('fInt').value,organismo:{nombre:on,contacto:oc},estado:$('fEstado').value||'Abierto'};
}

/* ===== Guardar (RTDB: registros) ===== */
async function guardar(){
  if(!$('fReg').reportValidity())return;
  const d=datosForm(),b=$('btnSave');b.disabled=true;$('saveT').textContent='Guardando…';
  try{
    if(editId){lastId=editId;await rtdb.ref('registros/'+editId).update(d)}
    else{const r=rtdb.ref('registros').push();lastId=r.key;await r.set({...d,fecha:new Date().toISOString(),seguimientos:[]})}
    if($('fOrg').value==='otro'&&d.organismo.nombre){organismos.push({nombre:d.organismo.nombre,contacto:d.organismo.contacto,tipo:'Otro'});fillOrgs()}
    toast(editId?'Registro actualizado.':'Registro guardado.');$('dReg').close();
  }catch(x){console.error(x);toast('No se pudo guardar el registro.','err')}
  finally{b.disabled=false;setTipo(tipo)}
}

/* ===== Datos ===== */
async function cargarExpedientes(){
  try{(await db2.collection('causas').get()).forEach(d=>{const v=d.data();if(v?.numCausa)expedientes[v.numCausa]={...v,firebaseId:d.id}})}
  catch(x){console.error('Error al cargar expedientes:',x);toast('Error al cargar expedientes. Verificá la configuración de Firebase.','err')}
}
function escucharRegistros(){
  rtdb.ref('registros').on('value',s=>{
    const v=s.val();registros=v?Object.keys(v).map(id=>({id,...v[id]})).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))):[];
    filtrar(true);tramite();
  },x=>{console.error(x);toast('No se pudieron cargar los casos.','err')});
}

/* ===== Render ===== */
function tramite(){
  const l=registros.filter(c=>c.estado==='En Proceso');$('tramN').textContent=l.length;
  $('tram').innerHTML=l.length?l.map(c=>{
    const sg=c.seguimientos||[],u=sg[sg.length-1];
    return `<div class="tr"><button class="go" data-a="view" data-id="${c.id}"><span class="av">${e(ini(c.nombre))}</span><span><b>${e(c.nombre||'Sin nombre')}</b><small>${e(c.tipo||'')}</small><small>${u?'Último seguimiento: '+e(String(u.fecha).split(',')[0]):'Sin seguimientos'}</small></span></button><button class="fu" data-a="seg" data-id="${c.id}" title="Agregar seguimiento" aria-label="Agregar seguimiento"><i class="bi bi-journal-plus"></i></button></div>`}).join(''):'<p class="empty">No hay casos en proceso.</p>';
}
function filtrar(keep){
  const q=$('q').value.toLowerCase(),t=$('ftipo').value,s=$('fest').value;
  filtrados=registros.filter(r=>(!q||(r.nombre||'').toLowerCase().includes(q)||(r.dni||'').toLowerCase().includes(q)||(r.tipo||'').toLowerCase().includes(q))&&(!t||r.tipo===t)&&(!s||(r.estado||'Abierto')===s));
  if(keep!==true)pagina=1;tabla();
}
function tabla(){
  const t=filtrados.length,P=Math.ceil(t/PAGE);
  if(!t){$('tabla').innerHTML='<p class="empty">No hay registros que coincidan con la búsqueda.</p>';$('pgi').textContent='';$('pgn').innerHTML='';return}
  pagina=Math.min(pagina,P);const a=(pagina-1)*PAGE,b=Math.min(a+PAGE,t);
  $('pgi').textContent=`Mostrando ${a+1}–${b} de ${t} registros`;
  $('tabla').innerHTML=`<table><thead><tr><th>Persona</th><th>Tipo</th><th>Estado</th><th class="h2">Organismo</th><th class="h">Intervención</th><th>Registro</th><th>Acciones</th></tr></thead><tbody>${filtrados.slice(a,b).map(c=>{
    const s=(c.seguimientos||[]).length,k=tipoDe(c.tipo);
    return `<tr id="r-${c.id}" class="${ST[c.estado]??''}">
     <td><div class="who"><span class="av">${e(ini(c.nombre))}</span><div><b>${e(c.nombre)}</b><small>DNI ${e(c.dni||'—')}${c.edad?', '+e(c.edad)+' años':''}</small></div></div></td>
     <td><span class="tag"><i class="bi bi-${k?TIPOS[k].i:'folder2'}"></i>${e(c.tipo||'—')}</span></td>
     <td>${pill(c.estado)}</td>
     <td class="h2">${e(c.organismo?.nombre||'—')}<div class="sub">${e(c.organismo?.contacto||'')}</div></td>
     <td class="h">${e(c.intervencion||'—')}</td>
     <td>${e(fmtF(c.fecha)||'—')}<div class="sub">${s} seguimiento${s===1?'':'s'}</div></td>
     <td><div class="acts"><button data-a="view" data-id="${c.id}" title="Ver detalle" aria-label="Ver detalle"><i class="bi bi-eye"></i></button><button data-a="edit" data-id="${c.id}" title="Editar" aria-label="Editar"><i class="bi bi-pencil-square"></i></button><button data-a="seg" data-id="${c.id}" title="Seguimiento" aria-label="Seguimiento"><i class="bi bi-journal-text"></i></button></div></td></tr>`}).join('')}</tbody></table>`;
  const pb=(p,l,x='',d=false)=>`<button class="pgb ${x}" data-a="pg" data-p="${p}" ${d?'disabled':''}>${l}</button>`;
  let i0=Math.max(1,pagina-2),i1=Math.min(P,i0+4);i0=Math.max(1,i1-4);
  $('pgn').innerHTML=pb(pagina-1,'<i class="bi bi-chevron-left"></i>','',pagina===1)+Array.from({length:i1-i0+1},(_,k)=>pb(i0+k,i0+k,i0+k===pagina?'on':'')).join('')+pb(pagina+1,'<i class="bi bi-chevron-right"></i>','',pagina===P);
  if(lastId){const r=$('r-'+lastId);if(r){r.classList.add('hl');r.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>r.classList.remove('hl'),2200)}lastId=null}
}

/* ===== Detalle / impresión ===== */
function ficha(r){
  const x=expedientes[r.expedienteReferencia],ex=r.expedienteReferencia?`${r.expedienteReferencia} - ${x?.caratula||'Sin carátula'}`:'No asociado',k=tipoDe(r.tipo);
  return {
    resumen:kv([['Tipo de caso',r.tipo],['Estado',R(pill(r.estado))],['Fecha de registro',fmtF(r.fecha,true)],['Nombre',r.nombre],['DNI',r.dni],['Edad',r.edad],['Teléfono',r.telefono||'No especificado'],...(r.direccion?[['Dirección',r.direccion]]:[])]),
    caso:kv([['Expediente de referencia',ex],[k?TIPOS[k].desc:'Descripción',nl(r.descripcion)],['Intervención de la Defensoría',r.intervencion],['Organismo interviniente',r.organismo?.nombre||'No especificado'],['Contacto del organismo',r.organismo?.contacto||'Sin contacto']])};
}
function verRegistro({id}){
  const r=registros.find(x=>x.id===id);if(!r)return;verActual=r;
  const f=ficha(r),sg=r.seguimientos||[];
  const P=[['Resumen','person',f.resumen],['Caso','folder2-open',f.caso],['Seguimientos','journal-text',sg.length?tl(sg):'<p class="empty">Sin seguimientos registrados.</p>']];
  $('verT').textContent=r.nombre||'Detalle del registro';
  $('verTabs').innerHTML=P.map(([t,i])=>`<button type="button" title="${t}"><i class="bi bi-${i}"></i><span>${t}</span></button>`).join('');
  $('verBody').innerHTML=P.map(([t,,h])=>`<div class="pane"><h4>${t}</h4>${h}</div>`).join('');
  setTab($('dVer'),0);$('dVer').showModal();
}
function setTab(d,i){
  $$('#'+d.id+' .tabs button').forEach((b,j)=>b.classList.toggle('on',i===j));
  $$('#'+d.id+' .pane').forEach((p,j)=>p.classList.toggle('on',i===j));
  d.querySelector('.mb').scrollTop=0;
}
const imprimirFicha=r=>{const f=ficha(r);imprimir('Registro de caso: '+r.tipo,`<h4>Datos de la persona</h4>${f.resumen}<h4>Detalles del caso</h4>${f.caso}`)};

/* ===== Seguimientos ===== */
const segArr=()=>Array.isArray(casoSeg?.seguimientos)?casoSeg.seguimientos:[];
function tlSeg(){const a=segArr();$('tl').innerHTML=a.length?tl(a,true):'<p class="empty">Sin seguimientos registrados.</p>'}
async function saveSeg(a,msg){
  try{await rtdb.ref('registros/'+casoSeg.id).update({seguimientos:a});casoSeg.seguimientos=a;tlSeg();toast(msg)}
  catch(x){console.error(x);toast('No se pudo guardar el seguimiento.','err')}
}

/* ===== Acciones (delegación de eventos) ===== */
const ACT={
  new:()=>{limpiar();setTipo('proteccion');$('dReg').showModal()},
  edit:({id})=>{
    const r=registros.find(x=>x.id===id);if(!r)return;
    limpiar();editId=id;setTipo(tipoDe(r.tipo)||'proteccion');
    $$('#regTabs button').forEach(b=>b.disabled=b.dataset.k!==tipo);
    $('fNom').value=r.nombre??'';$('fDni').value=r.dni??'';$('fEdad').value=r.edad??'';$('fTel').value=r.telefono??'';$('fDir').value=r.direccion??'';
    $('fDesc').value=r.descripcion??'';$('fInt').value=r.intervencion??'';$('fEstado').value=r.estado||'Abierto';
    if(r.expedienteReferencia){const x=expedientes[r.expedienteReferencia];$('fExp').value=r.expedienteReferencia;$('fExpS').value=x?`${r.expedienteReferencia} - ${x.caratula||'Sin carátula'}`:r.expedienteReferencia;$('expInfo').textContent=x?'Carátula: '+(x.caratula||''):''}
    const on=r.organismo?.nombre,i=organismos.findIndex(o=>o.nombre===on);
    if(i>=0)$('fOrg').value=i;else if(on){$('fOrg').value='otro';orgChange();$('fNOrg').value=on;$('fNCon').value=r.organismo.contacto??''}
    $('dReg').showModal();
  },
  view:verRegistro,save:guardar,
  seg:({id})=>{const r=registros.find(x=>x.id===id);if(!r)return;casoSeg={...r};$('nuevoSeg').value='';tlSeg();$('dSeg').showModal()},
  pg:({p})=>{pagina=+p;tabla()},
  addSeg:async()=>{const t=$('nuevoSeg').value.trim();if(!t)return;
    await saveSeg([...segArr(),{fecha:new Date().toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}),texto:t}],'Seguimiento agregado.');$('nuevoSeg').value=''},
  delSeg:async({i})=>{if(confirm('¿Eliminar este seguimiento?'))await saveSeg(segArr().filter((_,k)=>k!==+i),'Seguimiento eliminado.')},
  print:()=>imprimir('Listado de casos',`<table><thead><tr><th>Nombre</th><th>DNI</th><th>Tipo</th><th>Estado</th><th>Fecha</th></tr></thead><tbody>${filtrados.map(r=>`<tr><td>${e(r.nombre)}</td><td>${e(r.dni)}</td><td>${e(r.tipo)}</td><td>${e(r.estado||'Abierto')}</td><td>${e(fmtF(r.fecha))}</td></tr>`).join('')}</tbody></table>`),
  printVer:()=>verActual&&imprimirFicha(verActual),
  printSeg:()=>imprimir('Seguimiento del caso',$('tl').innerHTML),
  printReg:()=>imprimirFicha({...datosForm(),estado:'—',edad:V('fEdad'),fecha:new Date().toISOString()})
};
document.addEventListener('click',ev=>{
  const t=ev.target;
  if(!t.closest('.rel'))$('lstExp').style.display='none';
  if(t.closest('[data-close]'))return t.closest('dialog').close();
  const rt=t.closest('#regTabs button');if(rt){if(!rt.disabled)setTipo(rt.dataset.k);return}
  const tb=t.closest('.tabs button');if(tb)return setTab(tb.closest('dialog'),[...tb.parentNode.children].indexOf(tb));
  const ex=t.closest('#lstExp div[data-n]');
  if(ex){const n=ex.dataset.n;$('fExp').value=n;$('fExpS').value=ex.textContent;$('expInfo').textContent='Carátula: '+(expedientes[n]?.caratula||'');$('lstExp').style.display='none';return}
  if(t.tagName==='DIALOG'&&t.id!=='dReg')return t.close();
  const b=t.closest('[data-a]');if(!b)return;ev.preventDefault();ACT[b.dataset.a]?.(b.dataset);
});

/* ===== Inicio ===== */
$('regTabs').innerHTML=Object.entries(TIPOS).map(([k,t])=>`<button type="button" data-k="${k}" title="${t.n}"><i class="bi bi-${t.i}"></i><span class="lg">${t.n}</span><span class="sm">${t.s}</span></button>`).join('');
$('ftipo').innerHTML='<option value="">Todos los tipos</option>'+Object.values(TIPOS).map(t=>`<option>${t.n}</option>`).join('');
$('fInt').innerHTML='<option value="">Seleccionar intervención…</option>'+INTERV.map(i=>`<option>${i}</option>`).join('');
fillOrgs();setTipo('proteccion');
$('q').oninput=()=>filtrar();$('ftipo').onchange=()=>filtrar();$('fest').onchange=()=>filtrar();
$('fOrg').onchange=orgChange;
$('fExpS').addEventListener('focus',ev=>listaExp(ev.target.value));
$('fExpS').addEventListener('input',ev=>{$('fExp').value='';$('expInfo').textContent='';listaExp(ev.target.value)});
cargarExpedientes();escucharRegistros();
</script>
</body>
</html>
