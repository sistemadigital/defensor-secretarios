<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escritos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@property --arc{syntax:'<angle>';initial-value:70deg;inherits:false}
:root{--pad:clamp(12px,2.6vmin,32px);--gap:clamp(12px,2.6vmin,32px);--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--ink:#0b1f3a;--mut:#64748b;--bd:#e2e8f0;--bg:#eef1f6;--card:#fff;--field:#f6f8fc;--ac:#2563eb;--ac2:#4f46e5;--ease:cubic-bezier(.16,1,.3,1);--c-ind:#4f46e5;--c-grn:#065f46;--ok:#047857;--aviso:#b45309;--error:#b91c1c;--rad:clamp(22px,3.6vmin,40px);--accent:var(--c-ind);--a1:#06b6d4;--a2:#818cf8;--a3:#4338ca;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--ink:#e6eeff;--mut:#93a7cb;--bd:#1f3560;--bg:#071225;--card:#0f213f;--field:#0a1a33;--ac:#60a5fa;--ac2:#818cf8;--c-ind:#818cf8;--c-grn:#34d399;--ok:#34d399;--aviso:#fbbf24;--error:#f87171;color-scheme:dark}}
/* derivados del acento: se recalculan en cada tarjeta según su --accent */
:root,.sello,.panel,.tabla,dialog{--tint:color-mix(in srgb,var(--accent) 10%,var(--card));--lc:color-mix(in srgb,var(--accent) 14%,var(--bd));--glow:color-mix(in srgb,var(--accent) 32%,transparent)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{max-width:1360px;margin:0 auto;padding:var(--pad) var(--pad) calc(var(--pad)*2)}
:focus-visible{outline:2px solid var(--ac);outline-offset:4px}
h1,h2{font-family:var(--font)}
h1{font-size:clamp(1.5rem,3.6vmin,2.2rem);font-weight:800;letter-spacing:-.03em;line-height:1.15}
.tenue{color:var(--mut);font-size:.82rem;font-weight:500}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:var(--gap)}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* tarjetas: borde fino con arco de luz que orbita (igual que los módulos) */
.sello,.panel,.tabla,dialog{--ang:0deg;--arc:70deg;border:1.5px solid transparent;border-radius:var(--rad);color:var(--ink);
background:linear-gradient(var(--card),var(--card)) padding-box,conic-gradient(from var(--ang),transparent 0deg,transparent calc(360deg - var(--arc)),var(--a1) calc(360deg - var(--arc)*.65),var(--a2) calc(360deg - var(--arc)*.3),var(--a3) calc(360deg - 4deg),transparent 360deg) border-box,linear-gradient(var(--lc),var(--lc)) border-box;
box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -16px rgba(15,23,42,.14)}
.sello,.panel,.tabla{animation:orbit 9s linear infinite,fadeInUp .6s var(--ease) backwards;transition:transform .35s var(--ease),box-shadow .35s,--arc .5s}
.panel{--accent:var(--c-grn);--a2:#10b981;--a3:#065f46;animation-delay:-4.5s,.12s}
.tabla{animation-delay:-2s,.24s}
@keyframes orbit{to{--ang:360deg}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.sello:hover,.panel:hover{--arc:150deg;transform:translateY(-4px);box-shadow:0 1px 2px rgba(15,23,42,.05),0 26px 46px -20px var(--glow)}
.tabla:hover{--arc:150deg;box-shadow:0 1px 2px rgba(15,23,42,.05),0 26px 46px -24px var(--glow)}

/* botones */
.btn{font:700 .88rem var(--font);padding:.6em 1.15em;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--accent) 22%,var(--bd));background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;gap:.5em;align-items:center;justify-content:center;transition:transform .35s var(--ease),box-shadow .35s,border-color .3s,color .3s}
.btn:hover{transform:translateY(-2px);border-color:var(--accent);color:var(--accent);box-shadow:0 12px 24px -14px var(--glow)}
.btn.pri{background:linear-gradient(135deg,var(--a2),var(--a3));border-color:transparent;color:#fff}
.btn.pri:hover{color:#fff;box-shadow:0 14px 26px -12px var(--glow)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
kbd{font:700 .7rem var(--font);border:1px solid currentColor;border-radius:6px;padding:0 6px;opacity:.75}

/* hero */
.hero{display:grid;grid-template-columns:minmax(250px,330px) 1fr;gap:var(--gap);margin-bottom:var(--gap)}
.sello{padding:clamp(1rem,3vmin,1.6rem) clamp(1rem,3vmin,1.8rem);text-align:center;color:var(--accent);display:flex;flex-direction:column;justify-content:center}
.sello small{display:block;font-size:.82rem;font-weight:600;color:var(--mut)}
.num{font-family:var(--font);font-size:clamp(3.2rem,9vmin,4.8rem);line-height:1.05;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:4px 0;color:var(--accent)}
.num span{font-size:.4em;font-weight:600;letter-spacing:-.02em;color:var(--mut)}
.panel{padding:clamp(1rem,2.6vmin,1.4rem) clamp(1rem,3vmin,1.6rem)}
.pill{font:700 .8rem var(--font);border-radius:999px;padding:.25em 1em;border:1px solid;background:var(--tint);cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s}
.pill:hover{transform:translateY(-2px);box-shadow:0 10px 20px -14px currentColor}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.pill.bad{color:var(--aviso);border-color:color-mix(in srgb,var(--aviso) 35%,transparent);background:color-mix(in srgb,var(--aviso) 10%,var(--card))}
.kpis{display:flex;flex-wrap:wrap;gap:6px 26px;margin:14px 0}
.kpis b{display:block;font:800 1.55rem/1.1 var(--font);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:78px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.68rem;font-weight:600;color:var(--mut)}
.bars i{display:block;width:100%;background:linear-gradient(180deg,var(--a2),var(--a3));border-radius:7px 7px 3px 3px;min-height:3px;margin-bottom:2px;transition:filter .3s}
.bars div:hover i{filter:brightness(1.15) saturate(1.1)}

/* filtros y campos */
.filtros{display:grid;grid-template-columns:2fr 1fr 1fr 1.3fr auto;gap:8px;margin-bottom:var(--gap)}
input,select,textarea{font:inherit;width:100%;padding:.6em .95em;border:1.5px solid var(--bd);border-radius:14px;background:var(--card);color:var(--ink);transition:border-color .25s,box-shadow .25s}
input::placeholder,textarea::placeholder{color:var(--mut)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
input[type=radio],input[type=checkbox]{width:auto;accent-color:var(--accent)}
input[readonly]{background:var(--field);color:var(--mut);cursor:not-allowed}

/* tabla */
.tabla{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:.75em 1em;text-align:left;border-bottom:1px solid var(--bd);font-size:.87rem;vertical-align:middle}
th{font-weight:700;color:var(--mut);background:var(--tint);white-space:nowrap}
th.ord{cursor:pointer;color:var(--accent)}
tbody tr{cursor:pointer;transition:background .25s}tbody tr:hover{background:var(--tint)}tr:last-child td{border:0}
.n{font-size:1.15rem;font-weight:800;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}.n span{font-size:.8rem;font-weight:600;letter-spacing:0;color:var(--mut)}
.asunto{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;padding:.2em .9em;border-radius:999px;font-size:.75rem;font-weight:700;line-height:1.4;color:var(--accent);background:var(--tint);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.tag.si{color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card));border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.tag.no{color:var(--aviso);background:color-mix(in srgb,var(--aviso) 10%,var(--card));border-color:color-mix(in srgb,var(--aviso) 30%,transparent)}
/* botón de ícono: mismo efecto de relleno y giro que el ícono de los módulos */
.ic{display:inline-flex;align-items:center;justify-content:center;width:2.3rem;height:2.3rem;padding:0;border:0;border-radius:30%;font-size:.9rem;color:var(--accent);cursor:pointer;background:linear-gradient(135deg,var(--a2),var(--a3)) center/0% 0% no-repeat,var(--tint);transition:background-size .4s var(--ease),color .3s,box-shadow .35s,transform .35s var(--ease)}
.ic:hover,.ic:focus-visible{background-size:100% 100%,auto;color:#fff;transform:rotate(-4deg) scale(1.08);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.vacio{padding:44px 16px;text-align:center;color:var(--mut);font-weight:500}
.pag{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:var(--gap)}

/* diálogos */
dialog{width:min(820px,94vw);max-height:92vh;padding:0;box-shadow:0 1px 2px rgba(15,23,42,.05),0 40px 80px -28px rgba(11,31,58,.55)}
dialog[open]{animation:orbit 9s linear infinite,fadeInUp .45s var(--ease) backwards}
dialog::backdrop{background:rgba(7,18,37,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.in{padding:clamp(1rem,3vmin,1.6rem)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dh h2{font-size:1.3rem;font-weight:800;letter-spacing:-.03em}
.x{width:2.3rem;height:2.3rem;border:0;border-radius:30%;background:none;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--mut);transition:background .3s,color .3s,transform .35s var(--ease)}
.x:hover{background:var(--tint);color:var(--accent);transform:rotate(-4deg) scale(1.08)}
.df{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1fr 1.3fr;gap:0 20px}
label{display:block;font-weight:600;font-size:.85rem;margin-bottom:12px}
label input,label select,label textarea{margin-top:4px;font-weight:400}
label.rad{display:inline-flex;gap:6px;align-items:center;margin:0 16px 0 0}
fieldset{border:0;margin-bottom:12px}legend{font-size:.85rem;font-weight:600;margin-bottom:4px}
textarea{min-height:230px;resize:vertical;line-height:1.6}
.numbox{background:var(--tint);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:16px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.numbox b{font:800 1.4rem var(--font);letter-spacing:-.03em}
.av{font-size:.84rem;font-weight:500;padding:8px 12px;border-radius:12px;margin-top:8px;border-left:3px solid}
.av.aviso{background:color-mix(in srgb,var(--aviso) 12%,var(--card));border-color:var(--aviso);color:var(--ink)}.av.info{background:var(--tint);border-color:var(--accent)}
.lnk{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 20px;margin-bottom:14px}
.dl dt{font-size:.75rem;font-weight:600;color:var(--mut)}.dl dd{font-weight:600;margin:0;word-break:break-word}
.texto{white-space:pre-wrap;word-break:break-word;font:inherit;line-height:1.7;background:var(--field);border:1.5px solid var(--bd);border-radius:16px;padding:16px;max-height:46vh;overflow:auto}
.chk{list-style:none;padding:0;display:grid;gap:8px;margin:12px 0}
.chk li{padding:10px 14px;border-radius:14px;border-left:4px solid;background:var(--field);display:flex;flex-direction:column}
.chk .ok{border-color:var(--ok)}.chk .bad{border-color:var(--aviso)}.chk span{font-size:.84rem;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#0b1f3a;color:#fff;font-weight:600;padding:.7em 1.4em;border-radius:999px;box-shadow:0 18px 40px -16px rgba(11,31,58,.6);z-index:99;max-width:92vw;animation:toastIn .4s var(--ease)}
#toast.error{background:#b91c1c}#toast.success{background:#047857}
@media(max-width:820px){.hero,.cols{grid-template-columns:1fr}.filtros{grid-template-columns:1fr 1fr}.filtros input:first-child{grid-column:1/-1}.hm{display:none}.num{font-size:3.2rem}}
@media(prefers-reduced-motion:reduce){
.sello,.panel,.tabla,dialog,dialog[open]{animation:none;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--a1),var(--a3)) border-box}
#toast{animation:none}
*{transition:none!important}
.sello:hover,.panel:hover,.btn:hover,.pill:hover,.ic,.ic:hover,.ic:focus-visible,.x:hover{transform:none}}

/* ajustes propios de escritos (otra estructura de filtros, paginado y formulario) */
table{min-width:760px}
.kpis{margin:0 0 14px}
.filtros{grid-template-columns:repeat(5,1fr) auto}
.pag{flex-wrap:wrap;justify-content:space-between;gap:10px}
.ctl{display:flex;align-items:center;gap:6px}
.pb{min-width:2.5rem;padding:.5em .8em}
.tag.v{color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card));border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.tag.p{color:var(--aviso);background:color-mix(in srgb,var(--aviso) 10%,var(--card));border-color:color-mix(in srgb,var(--aviso) 30%,transparent)}
dialog{width:min(640px,94vw)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
input:disabled,select:disabled{background:var(--field);color:var(--mut);cursor:not-allowed;opacity:1}
#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:90;color:var(--accent);font-size:2rem}
@media(max-width:820px){.filtros{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loader" role="status" aria-label="Cargando"><i class="fa-solid fa-spinner fa-spin"></i></div>
<div class="wrap">
  <header class="top">
    <div><h1>Libro de Escritos</h1><p class="tenue">Sincronización en tiempo real</p></div>
    <div class="acts">
      <button class="btn" id="bPdf" type="button"><i class="fa-solid fa-file-pdf"></i> Exportar PDF</button>
      <button class="btn pri" id="bNew" type="button"><i class="fa-solid fa-plus"></i> Nuevo escrito <kbd>N</kbd></button>
    </div>
  </header>

  <section class="hero">
    <div class="sello"><small>Cantidad actual</small><div class="num" id="nextNum">—</div><small id="nextHint"></small></div>
    <div class="panel"><div class="kpis" id="kpis"></div><div class="bars" id="bars"></div></div>
  </section>

  <section class="filtros">
    <select id="fq" aria-label="Trimestre"></select>
    <select id="fm" aria-label="Mes"></select>
    <select id="fy" aria-label="Año"></select>
    <select id="ft" aria-label="Tipo"></select>
    <select id="fp" aria-label="Proceso"></select>
    <button class="btn" id="bClear" type="button">Limpiar</button>
  </section>

  <div class="tabla">
    <table>
      <thead><tr><th>Cant.</th><th>Año</th><th>Tipo</th><th>Proceso</th><th>Usuario</th><th>Fecha y hora</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="vacio" id="vacio" hidden>No hay registros que coincidan con los filtros.</div>
  </div>
  <nav class="pag">
    <span class="tenue" id="pinfo"></span>
    <div class="ctl"><button class="btn pb" id="prev" aria-label="Anterior"><i class="fa-solid fa-angle-left"></i></button><span class="ctl" id="nums"></span><button class="btn pb" id="next" aria-label="Siguiente"><i class="fa-solid fa-angle-right"></i></button></div>
  </nav>
</div>

<dialog id="dForm"><form class="in" id="form" novalidate>
  <div class="dh"><h2 id="fTitulo">Nuevo escrito</h2><button type="button" class="x" data-close aria-label="Cerrar">&times;</button></div>
  <div class="g2">
    <label>Cantidad<input id="fCant" readonly tabindex="-1"></label>
    <label>Año de registro<input id="fYear" readonly tabindex="-1"></label>
    <label>Tipo de escrito *<select id="fTipo"></select></label>
    <label>Tipo de proceso *<select id="fProc"></select></label>
    <label>Usuario *<select id="fUser"></select></label>
    <label>Fecha y hora<input id="fFecha" readonly tabindex="-1"></label>
  </div>
  <div class="df"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" id="bSave">Guardar</button></div>
</form></dialog>
<div id="toast" hidden role="status"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getFirestore,collection,addDoc,updateDoc,doc,onSnapshot,query,orderBy}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ============ CONFIG (base Firebase de escritos) ============ */
const db=getFirestore(initializeApp({apiKey:"AIzaSyBmUQw10DFePlCVF3qqA72480fhQqbkaNM",authDomain:"escritos-def6.firebaseapp.com",projectId:"escritos-def6",storageBucket:"escritos-def6.firebasestorage.app",messagingSenderId:"115939688115",appId:"1:115939688115:web:4d8818543aa8f11d0dbac6"}));
const col=collection(db,'escritos');
const TIPOS={varios:'Varios',patrocinio:'Patrocinio',demanda:'Demanda',contesta_demanda:'Contesta demanda',defensor_ausente:'Defensor Ausente',recurso:'Recurso',contesta_recurso:'Contesta Recurso',vinculacion:'Vinculacion',asume_patrocinio:'Asume patrocinio',recurso_revocatoria:'Recurso de Revocatoria',recurso_apelacion:'Recurso de Apelación',rec_rev_c_apelacion:'Rec Rev c Apelación',otros:'Otros'};
const PROCESOS={familia:'Familia',violencia:'Violencia Familiar',civil:'Civil',laboral:'Laboral',penal:'Penal'};
const USUARIOS=["Bazante Nadia Romina","Boillat Cesar Enrique","Cardozo Maria Raquel","Cedron Noelia Aurora","Corrales Alicia Mariela","Fioravante Rómulo","Gonzalez Alberto Misael","Gonzalez Juan Jose","Gudiño Natalia Esther","Martinis Carlos Esteban","Magnani Enzo Luciano","Pablos Patricia","Palacios Ana Gabriela","Ortega Lucia Noemi","Ramos Marcelo Gustavo","Riveros Patricia Soledad","Sosa Rita Cecilia"];
const MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MESES_L=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const POR_PAGINA=10,ANIO_INICIO=2026;

/* ============ UTILIDADES ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const fmt=t=>{const d=new Date(t);return`${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`};
const mesDe=t=>new Date(t).getMonth()+1;
const lbl=(m,k)=>m[k]||k||'—';
const opts=(pares,vacio)=>(vacio?`<option value="">${vacio}</option>`:'')+pares.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('');
let tt;function toast(msg,tipo='info'){const t=$('toast');t.textContent=msg;t.className=tipo;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,4000)}

/* ============ ESTADO Y FILTROS ============ */
let data=[],cur=null,page=1;
// KPIs, gráfico y tabla usan los mismos filtros (trimestre, mes, año, tipo y proceso)
const base=()=>{const y=$('fy').value,t=$('ft').value,p=$('fp').value;return data.filter(w=>(!y||String(w.year)===y)&&(!t||w.type===t)&&(!p||w.process===p))};
const filtrado=()=>{const q=$('fq').value,m=$('fm').value;return base().filter(w=>(!q||Math.floor((mesDe(w.timestamp)-1)/3)+1===+q)&&(!m||mesDe(w.timestamp)===+m))};

/* ============ FIREBASE (tiempo real) ============ */
onSnapshot(query(col,orderBy('timestamp','desc')),s=>{
  data=s.docs.map(d=>{const x=d.data();return{id:d.id,...x,fechaHora:fmt(x.timestamp)}});
  data.forEach((w,i)=>w.cant=data.length-i); // contador visual: el más antiguo es el 1
  pintarKpis();pintar();$('loader').hidden=true;
},e=>{console.error(e);$('loader').hidden=true;toast('Error de lectura en Firestore. Verificá tu configuración.','error')});

/* ============ RENDER ============ */
function pintarKpis(){
  const f=filtrado(),c=Array(12).fill(0);f.forEach(w=>{const m=mesDe(w.timestamp);if(m)c[m-1]++});
  const T=i=>c.slice(i*3,i*3+3).reduce((a,b)=>a+b,0),mx=Math.max(...c,1);
  $('kpis').innerHTML=[['Total',f.length],['Ene–Mar',T(0)],['Abr–Jun',T(1)],['Jul–Sep',T(2)],['Oct–Dic',T(3)]].map(([l,v])=>`<div><b>${v}</b><span class="tenue">${l}</span></div>`).join('');
  $('bars').innerHTML=c.map((v,i)=>`<div title="${MESES[i]}: ${v}"><i style="height:${v/mx*100}%"></i>${MESES[i]}</div>`).join('');
  $('nextNum').textContent=data.length;
  $('nextHint').textContent=data.length?`Último registro: ${data[0].fechaHora}`:'Aún no hay escritos';
}
function pintar(){
  const f=filtrado(),tp=Math.ceil(f.length/POR_PAGINA);
  if(page<1)page=1;if(page>tp&&tp>0)page=tp;
  const ini=(page-1)*POR_PAGINA;
  $('rows').innerHTML=f.slice(ini,ini+POR_PAGINA).map(w=>`<tr data-id="${esc(w.id)}"><td class="n">${w.cant}</td><td>${esc(w.year)}</td>
    <td><span class="tag ${w.type==='varios'?'v':w.type==='patrocinio'?'p':''}">${esc(lbl(TIPOS,w.type))}</span></td><td><span class="tag">${esc(lbl(PROCESOS,w.process))}</span></td>
    <td>${esc(w.user)}</td><td>${w.fechaHora}</td>
    <td><button class="ic" data-a="v" title="Ver" aria-label="Ver"><i class="fa-solid fa-eye"></i></button><button class="ic" data-a="e" title="Editar" aria-label="Editar"><i class="fa-solid fa-pen"></i></button></td></tr>`).join('');
  $('vacio').hidden=f.length>0;
  paginar(f.length,tp);
}
function paginar(total,tp){ // 1 … ventana … última, igual que antes
  $('pinfo').textContent=`Total: ${total} escritos`;
  const b=n=>`<button class="btn pb${n===page?' pri':''}" data-p="${n}">${n}</button>`,el='<span class="tenue">…</span>';
  let h='';
  if(tp>0){h=b(1);if(tp>1){
    let s=Math.max(2,page-2),e=Math.min(tp-1,page+2);const falta=3-(e-s+1);
    if(falta>0){if(s===2)e=Math.min(tp-1,e+falta);else if(e===tp-1)s=Math.max(2,s-falta)}
    if(s>2)h+=el;for(let i=s;i<=e;i++)h+=b(i);if(e<tp-1)h+=el;h+=b(tp)}}
  $('nums').innerHTML=h;
  $('prev').disabled=tp===0||page<=1;$('next').disabled=tp===0||page>=tp;
}
const filtrar=()=>{page=1;pintarKpis();pintar()};

/* ============ FORMULARIO ============ */
function abrir(id=null,solo=false){
  const w=id&&data.find(x=>x.id===id);if(id&&!w)return toast('Registro no encontrado','error');
  cur=id;$('fTitulo').textContent=!id?'Nuevo escrito':solo?'Detalle de escrito':'Editar escrito';
  $('fCant').value=w?w.cant:data.length+1;
  $('fYear').value=w?w.year:new Date().getFullYear();
  $('fTipo').value=w?w.type:'varios';$('fProc').value=w?w.process:'familia';$('fUser').value=w?w.user:'';
  $('fFecha').value=w?w.fechaHora:fmt(Date.now());
  ['fTipo','fProc','fUser'].forEach(i=>$(i).disabled=solo);$('bSave').hidden=solo;
  $('dForm').showModal();
}
async function guardar(ev){
  ev.preventDefault();if($('bSave').hidden)return;
  if(!$('fUser').value)return toast('Seleccioná un usuario','error');
  const d={year:$('fYear').value,type:$('fTipo').value,process:$('fProc').value,user:$('fUser').value};
  $('bSave').disabled=true;
  try{
    if(cur)await updateDoc(doc(db,'escritos',cur),d);else await addDoc(col,{...d,timestamp:Date.now()});
    $('dForm').close();toast('Escrito guardado','success');
  }catch(e){console.error(e);toast('Error al conectar con Firestore. Verificá tu configuración.','error')}
  $('bSave').disabled=false;
}

/* ============ EXPORTAR PDF (filtros actuales) ============ */
function exportarPdf(){
  const datos=filtrado();
  if(!datos.length)return toast('No hay datos para exportar con los filtros actuales.','error');
  if(!window.jspdf)return toast('No se pudo cargar el generador de PDF. Revisá tu conexión.','error');
  const doc=new window.jspdf.jsPDF('p','mm','a4'),W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),m=15,ahora=new Date();
  const sel=(id,m2)=>$(id).value?(m2?lbl(m2,$(id).value):$(id).value):'Todos';
  doc.setFontSize(18).setFont('helvetica','bold').text('REPORTE DE ESCRITOS JUDICIALES',W/2,20,{align:'center'});
  doc.setFontSize(10).setFont('helvetica','normal');
  doc.text('Filtros aplicados:',m,30);
  doc.text(`Trimestre: ${$('fq').value?'T'+$('fq').value:'Todos'} | Mes: ${$('fm').value?MESES_L[$('fm').value-1]:'Todos'} | Año: ${sel('fy')}`,m,35);
  doc.text(`Tipo: ${sel('ft',TIPOS)} | Proceso: ${sel('fp',PROCESOS)}`,m,40);
  doc.text(`Generado: ${fmt(ahora.getTime())} | Total registros: ${datos.length}`,m,45);
  doc.autoTable({startY:50,margin:{left:m,right:m},tableWidth:W-2*m,
    head:[['Cant.','Año','Tipo','Proceso','Usuario','Fecha y Hora']],
    body:datos.map(w=>[String(w.cant),w.year,lbl(TIPOS,w.type).toUpperCase(),lbl(PROCESOS,w.process).toUpperCase(),w.user,w.fechaHora]),
    styles:{fontSize:9,cellPadding:3,overflow:'linebreak',valign:'middle'},
    headStyles:{fillColor:[58,61,158],textColor:255,fontStyle:'bold',fontSize:10},alternateRowStyles:{fillColor:[248,249,250]},
    columnStyles:{0:{cellWidth:18,halign:'center'},1:{cellWidth:18,halign:'center'},2:{cellWidth:36,halign:'center'},3:{cellWidth:34,halign:'center'},4:{cellWidth:44},5:{cellWidth:30,halign:'center'}}});
  const n=doc.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8).setTextColor(128,128,128);
    doc.text(`Página ${i} de ${n}`,W/2,H-10,{align:'center'});doc.text('Sistema de Gestión de Escritos Judiciales',m,H-10)}
  doc.save(`reporte_escritos_${ahora.getFullYear()}${p2(ahora.getMonth()+1)}${p2(ahora.getDate())}_${p2(ahora.getHours())}${p2(ahora.getMinutes())}.pdf`);
}

/* ============ INICIO Y EVENTOS ============ */
$('fq').innerHTML=opts([[1,'T1 · Ene–Mar'],[2,'T2 · Abr–Jun'],[3,'T3 · Jul–Sep'],[4,'T4 · Oct–Dic']],'Todos los trimestres');
$('fm').innerHTML=opts(MESES_L.map((n,i)=>[i+1,n]),'Todos los meses');
const anios=[];for(let y=ANIO_INICIO;y<=new Date().getFullYear()+4;y++)anios.push([y,y]);
$('fy').innerHTML=opts(anios,'Todos los años');
$('ft').innerHTML=opts(Object.entries(TIPOS),'Todos los tipos');$('fp').innerHTML=opts(Object.entries(PROCESOS),'Todos los procesos');
$('fTipo').innerHTML=opts(Object.entries(TIPOS));$('fProc').innerHTML=opts(Object.entries(PROCESOS));
$('fUser').innerHTML=opts(USUARIOS.map(u=>[u,u]),'Seleccione un usuario');
['fq','fm','fy','ft','fp'].forEach(i=>$(i).addEventListener('change',filtrar));
$('bClear').onclick=()=>{['fq','fm','fy','ft','fp'].forEach(i=>$(i).value='');filtrar()};
$('bNew').onclick=()=>abrir();$('bPdf').onclick=exportarPdf;
$('rows').onclick=e=>{const tr=e.target.closest('tr');if(tr)abrir(tr.dataset.id,e.target.closest('[data-a]')?.dataset.a!=='e')};
$('nums').onclick=e=>{const b=e.target.closest('[data-p]');if(b){page=+b.dataset.p;pintar()}};
$('prev').onclick=()=>{if(page>1){page--;pintar()}};
$('next').onclick=()=>{if(page<Math.ceil(filtrado().length/POR_PAGINA)){page++;pintar()}};
$('form').onsubmit=guardar;
$('dForm').addEventListener('click',e=>{if(e.target===$('dForm')||e.target.closest('[data-close]'))$('dForm').close()});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||document.querySelector('dialog[open]')||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();abrir()}
});
</script>
